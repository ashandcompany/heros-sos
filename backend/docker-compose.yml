# Socle commun aux environnements. Il ne publie AUCUN port, ne contient AUCUN secret et applique les
# réglages de sécurité par défaut ; chaque environnement ajoute ce qui lui est propre :
#
#   docker-compose.dev.yml    développement : ports liés à 127.0.0.1, Mailpit, front rechargé à chaud
#   docker-compose.prod.yml   production    : TLS automatique, secrets en fichiers, ressources bornées
#
# Se lance avec `make up-dev` ou `make up-prod` (voir le Makefile et le README).
#
# Réseaux : `backend` (base de données, file de messages) n'a aucun accès extérieur ; `edge` relie le
# reverse proxy, l'API et le front. L'API est sur les deux : elle parle à la base et envoie des mails.

name: heros-sos

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: heros-sos/api:${APP_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HEROS_HTTP_ADDR: ":8080"
      # Seuls le reverse proxy et le front (adresses fixes, voir plus bas) sont crus sur l'adresse IP réelle
      # du client (en-tête X-Forwarded-For). Un autre conteneur du réseau ne peut pas se faire passer pour
      # un autre client. Les limites de débit par IP dépendent de cette configuration.
      HEROS_TRUSTED_PROXIES: ${PROXY_IP:-172.30.0.2}/32,${WEB_IP:-172.30.0.3}/32
    expose:
      - "8080"
    networks:
      - backend
      - edge
    # L'API n'écrit rien sur le disque, ne garde aucune capacité Linux et ne peut pas en gagner.
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 256
    # Laisse le temps de terminer les requêtes en cours et de vider la file de mails (20 s par défaut).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heros}
      POSTGRES_DB: ${POSTGRES_DB:-herossos}
    volumes:
      # PostgreSQL 18 : l'image attend le volume sur /var/lib/postgresql (et non plus sur .../data).
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    # Capacités minimales pour que l'entrypoint prépare le répertoire de données puis cède ses droits.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 128mb
    stop_grace_period: 30s
    healthcheck:
      # En TCP (-h) : pendant l'initialisation, un serveur temporaire répond sur le socket seulement ;
      # l'API ne doit pas démarrer avant le vrai serveur.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    <<: *hardening
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Valeur factice en HTTP seul (aucun certificat n'est demandé) ; obligatoire en production.
      ACME_EMAIL: ${ACME_EMAIL:-contact@heros-sos.invalid}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # Adresse fixe : c'est elle que l'API reconnaît comme reverse proxy.
        ipv4_address: ${PROXY_IP:-172.30.0.2}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
          # Les adresses dynamiques sont attribuées dans la moitié haute : les adresses fixes du proxy
          # et du front (PROXY_IP, WEB_IP) ne peuvent jamais être prises par un autre conteneur.
          ip_range: ${EDGE_IP_RANGE:-172.30.0.128/25}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
