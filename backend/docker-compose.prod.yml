# Production. À utiliser avec docker-compose.yml, via `make up-prod` :
#
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Principes :
#   - un seul point d'entrée : le reverse proxy (80/443, TLS automatique) ; la base, l'API et le front
#     n'ont AUCUN port publié, et le réseau `backend` n'a aucun accès extérieur ;
#   - aucun secret dans l'environnement ni dans le dépôt : ils sont montés en fichiers (/run/secrets),
#     générés par `make secrets` ; l'API les lit via HEROS_*_FILE ;
#   - les migrations sont une tâche dédiée qui doit réussir avant le démarrage de l'API ;
#   - ressources bornées, journaux tournants, systèmes de fichiers en lecture seule, sans capacités.
#
# Prérequis : `.env.production` (voir .env.production.example) et `secrets/` (voir `make secrets`).

x-api-config: &api-config
  image: heros-sos/api:${APP_VERSION:-dev}
  env_file:
    - .env.production
  environment: &api-environment
    HEROS_ENV: production
    HEROS_AUTO_MIGRATE: "false"
    HEROS_DATABASE_URL_FILE: /run/secrets/database_url
    HEROS_CRYPTO_KEYS_FILE: /run/secrets/crypto_keys
    HEROS_CSRF_SECRET_FILE: /run/secrets/csrf_secret
    HEROS_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    HEROS_OMDB_API_KEY_FILE: /run/secrets/omdb_api_key
    HEROS_ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN est obligatoire (voir .env.production.example)}
    HEROS_PUBLIC_BASE_URL: https://${DOMAIN}
    HEROS_MAIL_DRIVER: smtp
  secrets:
    - database_url
    - crypto_keys
    - csrf_secret
    - smtp_password
    - omdb_api_key

services:
  # Applique les migrations puis s'arrête. L'API ne démarre que si elle a réussi.
  migrate:
    # Même image que l'API (construite une seule fois, par le service `api`).
    <<: *api-config
    command: ["-migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    <<: *api-config
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Argon2id : 4 hachages simultanés × 64 Mio = 256 Mio, plus le tas Go.
    mem_limit: 768m
    cpus: 1.0

  db:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    mem_limit: 1g
    cpus: 1.0

  proxy:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL est obligatoire (voir .env.production.example)}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # Cible `runtime` (dernière étape) : image de production sans dépendances de développement.
    image: heros-sos/web:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Le serveur Next appelle l'API directement sur le réseau `edge`, sans repasser par le proxy.
      API_URL: http://api:8080/api/v1
    networks:
      edge:
        ipv4_address: ${WEB_IP:-172.30.0.3}
    # Le système de fichiers reste inscriptible : Next.js écrit son cache de rendu dans .next/.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Pas encore utilisé : la file de mails est aujourd'hui interne à l'API. À activer avec
  # `--profile rabbitmq` quand le worker de mails sera branché dessus.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["rabbitmq"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-heros}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

# Fichiers générés par `make secrets` (le dossier secrets/ n'est jamais versionné).
secrets:
  database_url:
    file: ./secrets/database_url
  postgres_password:
    file: ./secrets/postgres_password
  crypto_keys:
    file: ./secrets/crypto_keys
  csrf_secret:
    file: ./secrets/csrf_secret
  smtp_password:
    file: ./secrets/smtp_password
  omdb_api_key:
    file: ./secrets/omdb_api_key
  rabbitmq_password:
    file: ./secrets/rabbitmq_password

volumes:
  rabbitmq_data:
