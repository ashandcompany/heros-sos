      type: object
      required: [id, alias, filmCount]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        filmCount: { type: integer }

    VillainFilmPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Film" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    IncidentPayload:
      type: object
      required: [typeId, title, description, location]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: |
            Identifiant choisi par le client (facultatif). Un appareil hors ligne le fixe à la déclaration pour
            reconnaître son incident une fois synchronisé. 409 (`incident_already_exists`) s'il est déjà pris.
        typeId: { type: integer, format: int32 }
        title:
          type: string
          maxLength: 80
          description: Titre court, affiché dans les listes.
        description: { type: string }
        citizensRescued:
          { type: integer, format: int32, minimum: 0, default: 0 }
        location:
          type: object
          required: [address, city]
          additionalProperties: false
          properties:
            address: { type: string }
            city: { type: string }
            postalCode: { type: string }
            country: { type: string }
            addressComplement: { type: string }
            latitude: { type: number, format: double, nullable: true }
            longitude: { type: number, format: double, nullable: true }
        occurredAt: { type: string, format: date-time, nullable: true }
        villainIds:
          type: array
          items: { type: string, format: uuid }

    Incident:
      type: object
      required:
        [
          id,
          typeId,
          title,
          description,
          status,
          priority,
          citizensRescued,
          location,
          villainIds,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        typeId: { type: integer, format: int32 }
        typeCode: { type: string }
        typeLabel: { type: string }
        title:
          type: string
          description: Titre court de l'incident ; vide pour un incident déclaré avant son introduction.
        description: { type: string }
        status:
          { type: string, enum: [reported, in_progress, succeeded, failed] }
        priority: { type: string, enum: [high, normal, low] }
        citizensRescued: { type: integer, format: int32 }
        location:
          type: object
          required: [address, city]
          properties:
            address: { type: string }
            city: { type: string }
            postalCode: { type: string }
            country: { type: string }
            addressComplement: { type: string }
            latitude: { type: number, format: double, nullable: true }
            longitude: { type: number, format: double, nullable: true }
        occurredAt: { type: string, format: date-time, nullable: true }
        villainIds:
          type: array
          items: { type: string, format: uuid }
        interventionId: { type: string, format: uuid }
        villains:
          type: array
          items:
            type: object
            required: [id, alias]
            properties:
              id: { type: string, format: uuid }
              alias: { type: string }
        createdAt: { type: string, format: date-time }

    IncidentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        nextCursor:
          type: string
          description: Valeur du paramètre `cursor` qui donne la page suivante. Absente de la dernière page.

    IncidentSummary:
      type: object
      description: Incident vu depuis la fiche publique d'un héros ou d'un vilain.
      required:
        [
          id,
          title,
          typeCode,
          typeLabel,
          status,
          city,
          createdAt,
          resolvedAt,
          lead,
          villains,
        ]
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          description: Titre court de l'incident ; vide pour un incident déclaré avant son introduction.
        typeCode: { type: string }
        typeLabel: { type: string }
        status:
          { type: string, enum: [reported, in_progress, succeeded, failed] }
        city: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: Fin de l'intervention réussie ; `null` si l'incident n'est pas résolu.
        lead:
          type: object
          nullable: true
          description: Héros qui mène la dernière intervention ; `null` sans intervention ou si son profil n'est plus public.
          required: [id, alias]
          properties:
            id: { type: string, format: uuid }
            alias: { type: string }
        villains:
          type: array
          items:
            type: object
            required: [id, alias]
            properties:
              id: { type: string, format: uuid }
              alias: { type: string }

    IncidentSummaryPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IncidentSummary" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    RateableInterventionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RateableIntervention" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    RateableIntervention:
      type: object
      required:
        [
          interventionId,
          incidentId,
          outcome,
          endedAt,
          heroId,
          heroAlias,
          review,
        ]
      properties:
        interventionId: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        outcome: { type: string, enum: [succeeded, failed] }
        endedAt: { type: string, format: date-time }
        heroId: { type: string, format: uuid }
        heroAlias: { type: string }
        review:
          allOf: [{ $ref: "#/components/schemas/HeroReview" }]
          nullable: true

    HeroReviewPayload:
      type: object
      required: [heroId, rating]
      additionalProperties: false
      properties:
        heroId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }

    HeroReviewEditPayload:
      type: object
      required: [rating]
      additionalProperties: false
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }

    HeroReview:
      type: object
      required: [id, interventionId, heroId, rating, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        interventionId: { type: string, format: uuid }
        heroId: { type: string, format: uuid }
        heroAlias: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        status: { type: string, enum: [published, pending, hidden] }
        moderatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        reply: { $ref: "#/components/schemas/HeroReviewReply" }

    HeroReviewPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HeroReview" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    HeroReputation:
      type: object
      required: [averageRating, ratingsCount, ratings, total, limit, offset]
      properties:
        averageRating: { type: number, format: double, minimum: 0, maximum: 5 }
        ratingsCount:
          type: integer
          minimum: 0
          description: "Nombre d'avis publiés inclus dans la moyenne."
        ratings:
          type: array
          items: { $ref: "#/components/schemas/HeroReview" }
        total:
          type: integer
          minimum: 0
          description: "Nombre total d'avis reçus, tous statuts confondus."
        limit: { type: integer }
        offset: { type: integer }

    HeroReviewReplyPayload:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }

    HeroReviewReply:
      type: object
      required: [reviewId, content, status, createdAt]
      properties:
        reviewId: { type: string, format: uuid }
        content: { type: string }
        status: { type: string, enum: [published, pending, hidden] }
        moderatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time }

    PublicHeroReputation:
      type: object
      required: [averageRating, ratingsCount, reviews]
      properties:
        averageRating: { type: number, format: double, minimum: 0, maximum: 5 }
        ratingsCount: { type: integer, minimum: 0 }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/HeroReview" }

    HeroReviewStatusPayload:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [published, hidden] }

    HeroReviewReplyModerationItem:
      type: object
      required: [reply, heroAlias, rating, reviewStatus]
      properties:
        reply: { $ref: "#/components/schemas/HeroReviewReply" }
        heroAlias: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        reviewStatus: { type: string, enum: [published, pending, hidden] }

    HeroReviewReplyModerationPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HeroReviewReplyModerationItem" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    InterventionParticipant:
      type: object
      required: [heroId, role, participation, outcomeValidation, isActive]
      properties:
        heroId: { type: string, format: uuid }
        alias: { type: string }
        role: { type: string, enum: [lead, member] }
        participation: { type: string, enum: [invited, confirmed] }
        invitedBy: { type: string, format: uuid }
        outcomeValidation: { type: string, enum: [pending, approved, rejected] }
        isActive: { type: boolean }
        invitedAt: { type: string, format: date-time }
        joinedAt: { type: string, format: date-time }

    Intervention:
      type: object
      required: [id, incidentId, version, status, startedAt, participants]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        version:
          type: integer
          description: |
            Version de l'intervention dans le journal d'événements (une de plus à chaque action). À renvoyer comme
            `expectedVersion` pour qu'une action faite sur une lecture périmée soit refusée (409,
            `intervention_version_conflict`) plutôt qu'appliquée.
        status: { type: string, enum: [in_progress, succeeded, failed] }
        proposedStatus: { type: string, enum: [succeeded, failed] }
        proposedBy: { type: string, format: uuid }
        decidedBy: { type: string, format: uuid }
        notes: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        participants:
          type: array
          items: { $ref: "#/components/schemas/InterventionParticipant" }

    InviteHeroesPayload:
      type: object
      required: [heroIds]
      additionalProperties: false
      properties:
        heroIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }

    InterventionOutcomePayload:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [succeeded, failed] }
        notes: { type: string }
        expectedVersion:
          type: integer
          description: Version de l'intervention lue par le client (facultative). Voir `Intervention.version`.

    InterventionOutcomeValidationPayload:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: boolean }
        expectedVersion:
          type: integer
          description: Version de l'intervention lue par le client (facultative). Voir `Intervention.version`.

    Account:
      type: object
      required:
        [
          id,
          role,
          civility,
          firstName,
          lastName,
          birthDate,
          email,
          mobilePhone,
          address,
          newsletterSubscribed,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid, description: Identifiant du compte. }
        role:
          {
            type: string,
            enum: [citizen, hero, moderator],
            description: Rôle du compte.,
          }
        civility:
          {
            type: string,
            enum: [madame, monsieur, non-precise],
            description: Civilité.,
          }
        firstName: { type: string, description: Prénom. }
        lastName: { type: string, description: Nom de famille. }
        birthDate:
          {
            type: string,
            format: date,
            description: "Date de naissance (AAAA-MM-JJ).",
          }
        email:
          { type: string, format: email, description: Adresse de connexion. }
        pendingEmail:
          type: string
          format: email
          description: Nouvelle adresse demandée, en attente de validation par un modérateur. Absente sinon.
        pendingEmailConfirmed:
          type: boolean
          description: "Présent (vrai) quand le titulaire de `pendingEmail` l'a confirmée par le lien reçu. Absent tant que ce n'est pas fait, et sans demande en attente."
        mobilePhone:
          type: string
          description: Numéro de portable, sans séparateurs. Vide pour un compte créé hors inscription.
        address: { $ref: "#/components/schemas/AccountAddress" }
        avatarUrl:
          type: string
          description: |
            Adresse de la photo de profil, chemin absolu sur la même origine que l'API
            (`GET /avatars/{name}`). Absente tant qu'aucune photo n'a été envoyée.
        newsletterSubscribed:
          type: boolean
          description: Vrai si l'adresse du compte reçoit la newsletter.
        createdAt:
          {
            type: string,
            format: date-time,
            description: Date de création du compte.,
          }
        hero: { $ref: "#/components/schemas/AccountHero" }

    AccountAddress:
      type: object
      required: [street, postalCode, city, country]
      properties:
        street: { type: string, description: Numéro et nom de la voie. }
        complement:
          {
            type: string,
            description: "Complément d'adresse, absent s'il n'y en a pas.",
          }
        postalCode: { type: string, description: Code postal. }
        city: { type: string, description: Commune. }
        country:
          {
            type: string,
            description: Code pays ISO 3166-1 alpha-2.,
            example: FR,
          }

    AccountHero:
      type: object
      description: Profil public d'un super-héros. Présent seulement quand `role` vaut `hero`.
      required: [alias, bio]
      properties:
        alias: { type: string, description: Pseudo public. }
        bio: { type: string, description: Description publique. }

    ContactUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        mobilePhone:
          type: string
          description: Portable français (06 ou 07) ou international (+33…) ; espaces, points et tirets sont ignorés.
        address: { $ref: "#/components/schemas/AddressUpdate" }

    AddressUpdate:
      type: object
      required: [street, postalCode, city, country]
      additionalProperties: false
      properties:
        street:
          {
            type: string,
            maxLength: 200,
            description: Numéro et nom de la voie.,
          }
        complement:
          type: string
          nullable: true
          maxLength: 200
          description: "Complément d'adresse. Absent ou `null` : le complément actuel est conservé. Chaîne vide : il est effacé."
        postalCode:
          {
            type: string,
            description: Code postal (cinq chiffres pour la France).,
          }
        city: { type: string, maxLength: 100, description: Commune. }
        country:
          {
            type: string,
            description: "Code pays ISO 3166-1 alpha-2, en majuscules.",
            example: FR,
          }

    AvatarResponse:
      type: object
      required: [avatarUrl]
      properties:
        avatarUrl:
          type: string
          description: Adresse de la nouvelle photo (chemin absolu sur la même origine que l'API).

    EmailChangeRequestPayload:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          {
            type: string,
            format: email,
            description: Nouvelle adresse souhaitée.,
          }

    EmailChangeRequestStatus:
      type: object
      required: [newEmail, status]
      properties:
        newEmail:
          {
            type: string,
            format: email,
            description: "La nouvelle adresse, normalisée en minuscules.",
          }
        status:
          {
            type: string,
            enum: [pending, approved, rejected],
            description: État de la demande.,
          }

    NewsletterPreferencePayload:
      type: object
      required: [subscribed]
      additionalProperties: false
      properties:
        subscribed:
          {
            type: boolean,
            description: "Vrai pour recevoir la newsletter, faux pour s'en retirer.",
          }

    EmailChangeRequestItem:
      type: object
      required:
        [
          id,
          userId,
          firstName,
          lastName,
          currentEmail,
          newEmail,
          status,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de la demande (paramètre `id` des routes de décision). Il change quand le titulaire remplace sa demande.
        userId:
          {
            type: string,
            format: uuid,
            description: Identifiant du compte concerné.,
          }
        firstName: { type: string, description: Prénom du demandeur. }
        lastName: { type: string, description: Nom du demandeur. }
        currentEmail: { type: string, format: email, description: Adresse actuelle du compte. }
        newEmail: { type: string, format: email, description: Adresse demandée. }
        status: { type: string, enum: [pending, approved, rejected], description: État de la demande. }
        createdAt: { type: string, format: date-time, description: Date de dépôt de la demande. }
        confirmedAt:
          type: string
          format: date-time
          description: "Date à laquelle le titulaire de la nouvelle adresse l'a confirmée par le lien reçu. Absente tant qu'elle ne l'est pas : un modérateur ne peut alors que refuser la demande."
        reviewedAt: { type: string, format: date-time, description: "Date de la décision, absente tant que la demande est en attente." }

    EmailChangeRequestPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EmailChangeRequestItem" }
        total:
          {
            type: integer,
            description: "Nombre total de demandes correspondant au filtre, toutes pages confondues.",
          }
        limit: { type: integer, description: Taille de page appliquée. }
        offset: { type: integer, description: Nombre d'éléments sautés. }

    ContactMessageRequest:
      type: object
      required: [name, email, subject, message]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80, description: Nom du visiteur. }
        email:
          {
            type: string,
            format: email,
            description: Adresse où l'équipe répondra.,
          }
        subject:
          type: string
          enum: [question, compte, donnees, partenariat, autre]
          description: "Objet de la demande : question sur le service, problème de compte, données personnelles, presse ou partenariat, autre."
        message:
          type: string
          minLength: 20
          maxLength: 2000
          description: Le message. Les retours à la ligne sont conservés.

    NewsletterSubscriptionRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Adresse à abonner. }
