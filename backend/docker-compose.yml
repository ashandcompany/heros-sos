services:
  api:
    build:
      context: .
      dockerfile: DOCKERFILE
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HEROS_DATABASE_URL: postgres://${POSTGRES_USER:-heros}:${POSTGRES_PASSWORD:-heros}@db:5432/${POSTGRES_DB:-herossos}?sslmode=disable
      HEROS_AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heros}
      POSTGRES_DB: ${POSTGRES_DB:-herossos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-heros}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-heros}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:
