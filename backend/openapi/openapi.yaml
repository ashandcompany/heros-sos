                  reason: Le dossier ne permet pas de vérifier l'identité du demandeur.
      responses:
        "204": { description: Demande refusée. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La demande a déjà été traitée (`hero_request_not_pending`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                deja-traitee:
                  summary: Demande déjà traitée
                  value:
                    error:
                      code: hero_request_not_pending
                      message: Cette demande a déjà été traitée.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

