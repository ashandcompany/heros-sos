name: Frontend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "frontend/**"
      # Le contrat de l'API génère les types du frontend (`npm run api:types`).
      - "backend/openapi/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Seules les vulnérabilités high/critical font échouer (low/moderate tolérées).
      # Avis ignorés (à retirer dès qu'un correctif existe) :
      # - GHSA-vfj7-8cjw-p6xm : braces@3.0.3 (dernière version, aucun correctif), dépendance de dev
      #   d'eslint-config-next ; absent des dépendances de production (`npm audit --omit=dev`).
      - name: Dependency audit
        run: npx --yes audit-ci@7.1.0 --high --allowlist GHSA-vfj7-8cjw-p6xm

      - name: Check formatting
        run: npx prettier --check .

      # `next build` ne lance plus ESLint depuis Next 16 : le lint doit avoir sa propre étape.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test

      # Types de l'API à jour avec backend/openapi/openapi.yaml (sinon : `npm run api:types`).
      - name: Check API types
        run: npm run api:types:check

      - name: Build
        run: npm run build

  # Parcours dans le navigateur (Playwright), sur le build de production en mode mock.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Le serveur (build + start, API_URL vide) est lancé par playwright.config.ts.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
