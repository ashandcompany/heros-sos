        "500": { $ref: "#/components/responses/InternalError" }

  /incidents:
    get:
      tags: [Incidents]
      summary: Incidents disponibles pour une intervention
      description: Liste les incidents signalés, en cours ou échoués, sans identité civile du déclarant.
      operationId: listIncidents
      security: [{ sessionCookie: [] }]
      parameters:
        - name: reporterId
          in: query
          description: Identifiant du déclarant; un citoyen ne peut filtrer que sur son propre identifiant.
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Une page d'incidents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Incidents]
      summary: Déclarer un incident
      description: |
        Tout utilisateur connecté peut déclarer un incident classé par un type existant. Les vilains
        sont facultatifs et plusieurs vilains peuvent être associés. L'adresse est conservée en clair
        pour permettre la détection des doublons prévue par le schéma.
      operationId: createIncident
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentPayload" }
      responses:
        "201":
          description: Incident déclaré, à l'état `reported` et à la priorité `normal` par défaut.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Détail d'un incident
      operationId: getIncident
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: L'incident et ses vilains associés.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /incidents/{incidentId}/interventions:
    post:
      tags: [Incidents]
      summary: Démarrer une intervention
      description: Réservé aux héros approuvés. Le héros devient lead et participant confirmé.
      operationId: startIntervention
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Intervention démarrée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervention" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Incident déjà pris, héros déjà actif ailleurs, ou incident non disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{id}:
    get:
      tags: [Incidents]
      summary: Détail d'une intervention
      description: Accessible aux héros connectés et aux modérateurs afin de permettre aux héros de rejoindre l'équipe.
      operationId: getIntervention
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Intervention et participants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervention" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{id}/join:
    post:
      tags: [Incidents]
      summary: Rejoindre une intervention
      description: Un héros approuvé rejoint directement comme membre confirmé.
      operationId: joinIntervention
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Participation confirmée. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Le héros est déjà lié ou engagé ailleurs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{id}/invitations:
    post:
      tags: [Incidents]
      summary: Inviter des héros à une intervention
      description: Un participant confirmé peut inviter des héros approuvés, qui doivent confirmer leur présence.
      operationId: inviteHeroes
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteHeroesPayload" }
      responses:
        "204": { description: Invitations enregistrées et envoyées. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Un héros est déjà lié à l'intervention.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{id}/invitations/me/confirm:
    post:
      tags: [Incidents]
      summary: Confirmer une invitation
      operationId: confirmInterventionInvitation
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Invitation confirmée. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Aucune invitation en attente, intervention en vote ou héros déjà actif ailleurs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{id}/invitations/me/decline:
    post:
      tags: [Incidents]
      summary: Refuser une invitation
      description: La ligne de participation invitée est supprimée.
      operationId: declineInterventionInvitation
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Invitation refusée. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Aucune invitation en attente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{id}/outcome:
    post:
      tags: [Incidents]
      summary: Proposer ou déclarer le résultat
      description: Un héros seul clôt directement; une équipe soumet le résultat à validation unanime.
      operationId: proposeInterventionOutcome
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterventionOutcomePayload" }
      responses:
        "204": { description: Résultat déclaré ou soumis à validation. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Résultat déjà proposé ou héros non participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{id}/outcome/validate:
    post:
      tags: [Incidents]
      summary: Valider ou refuser le résultat proposé
      operationId: validateInterventionOutcome
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/InterventionOutcomeValidationPayload",
              }
      responses:
        "204":
          {
            description: Validation enregistrée; le résultat peut clore l'intervention si tous approuvent.,
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Aucun résultat en attente, validation déjà enregistrée ou héros non participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/interventions/{id}/decision:
    post:
      tags: [Modération]
      summary: Arbitrer le résultat d'une intervention
      description: Un modérateur tranche et clôt l'intervention et l'incident.
      operationId: arbitrateInterventionOutcome
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterventionOutcomePayload" }
      responses:
        "204": { description: Décision appliquée. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: L'intervention n'est plus en cours ou aucun désaccord n'a été signalé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        Cookie de session, posé par `POST /auth/login` (`__Host-session` en production). Un
        navigateur l'envoie tout seul : **ne rien saisir ici**. Il existe pour indiquer quelles
        routes demandent d'être connecté.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Jeton CSRF : la valeur de `csrfToken` renvoyée par `POST /auth/login` et `GET /auth/me`.
        Exigé sur les écritures authentifiées. À coller ici après la connexion.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Identifiant de l'utilisateur dont la demande est traitée (champ `userId` de la liste des demandes).
      schema: { type: string, format: uuid }
      example: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
    Id:
      name: id
      in: path
      required: true
      description: Identifiant de l'utilisateur (champ `id` de la liste des comptes).
      schema: { type: string, format: uuid }
      example: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
    Limit:
      name: limit
      in: query
      description: Nombre d'éléments par page (1 à 100, 20 par défaut).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Nombre d'éléments à sauter.
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: "Requête mal formée (`bad_request`) : JSON invalide, champ inconnu, corps vide."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            json-invalide:
              summary: Corps qui n'est pas du JSON valide
              value:
                error:
                  code: bad_request
                  message: Le corps de la requête n'est pas un JSON valide.
    BadRequestOrInvalidToken:
      description: Requête mal formée (`bad_request`) ou lien invalide, expiré ou déjà utilisé (`invalid_token`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            lien-invalide:
              summary: Lien invalide, expiré ou déjà utilisé
              value:
                error:
                  code: invalid_token
                  message: Ce lien est invalide, expiré ou déjà utilisé.
            json-invalide:
              summary: Corps qui n'est pas du JSON valide
              value:
                error:
                  code: bad_request
                  message: Le corps de la requête n'est pas un JSON valide.
    Unauthenticated:
      description: Session absente ou expirée (`unauthenticated`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            session-absente:
              summary: Session absente ou expirée
              value:
                error:
                  code: unauthenticated
                  message: Authentification requise.
    Forbidden:
      description: |
        Refusé : origine non autorisée (`origin_not_allowed`), jeton CSRF absent ou invalide
        (`csrf_invalid`), ou rôle insuffisant (`forbidden`, `protected_account`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            origine:
              summary: Origine non autorisée
              value:
                error:
                  code: origin_not_allowed
                  message: Origine non autorisée.
            csrf:
              summary: Jeton CSRF absent ou invalide
              value:
                error:
                  code: csrf_invalid
                  message: Jeton CSRF absent ou invalide.
            role:
              summary: Rôle insuffisant
              value:
                error:
                  code: forbidden
                  message: Vous n'avez pas les droits nécessaires.
            compte-protege:
              summary: Compte de modérateur
              value:
                error:
                  code: protected_account
                  message: Les comptes de modérateur ne peuvent pas être désactivés par l'API.
    NotFound:
      description: Ressource introuvable (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            utilisateur:
              summary: Utilisateur introuvable
              value:
                error:
                  code: not_found
                  message: Utilisateur introuvable.
    PayloadTooLarge:
      description: Corps de requête trop volumineux (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            trop-gros:
              summary: Corps trop volumineux
              value:
                error:
                  code: payload_too_large
                  message: Le corps de la requête est trop volumineux.
    UnsupportedMediaType:
      description: Le corps doit être de type `application/json` (`unsupported_media_type`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            pas-json:
              summary: Corps qui n'est pas en application/json
              value:
                error:
                  code: unsupported_media_type
                  message: Le corps de la requête doit être au format application/json.
    ValidationFailed:
      description: Données invalides (`validation_failed`) ; `fields` détaille chaque champ.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            champs-invalides:
              summary: Deux champs invalides
              value:
                error:
                  code: validation_failed
                  message: Certaines informations sont invalides.
                  fields:
                    email: invalid
                    password: weak
    RateLimited:
      description: Trop de requêtes (`rate_limited`) ou compte verrouillé (`account_locked`).
      headers:
        Retry-After:
          description: Délai en secondes avant de réessayer.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            trop-de-requetes:
              summary: Trop de requêtes
              value:
                error:
                  code: rate_limited
                  message: Trop de tentatives, réessayez plus tard.
            compte-verrouille:
              summary: Compte verrouillé
              value:
                error:
                  code: account_locked
                  message: Compte temporairement verrouillé après trop d'échecs de connexion.
    InternalError:
      description: Erreur interne (`internal_error`). Le détail n'est jamais exposé.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            erreur-interne:
              summary: Erreur interne
              value:
                error:
                  code: internal_error
                  message: Une erreur interne est survenue.

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Code stable destiné au frontend.
              example: invalid_credentials
            message:
              type: string
              description: Message destiné à l'affichage.
            fields:
              type: object
              description: Pour les erreurs de validation, champ → code (`required`, `invalid`, `too_short`, `too_long`, `weak`).
              additionalProperties: { type: string }

    UserView:
      type: object
      required: [id, displayName, role, email]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Identifiant de l'utilisateur.,
          }
        displayName:
          type: string
          description: Pseudo pour un super-héros, prénom sinon.
        role:
          {
            type: string,
            enum: [citizen, hero, moderator],
            description: Rôle de l'utilisateur.,
          }
        email:
          { type: string, format: email, description: Adresse email du compte. }

    Address:
      type: object
      required: [street, postalCode, city, country]
      additionalProperties: false
      properties:
        street:
          {
            type: string,
            maxLength: 200,
            description: Numéro et nom de la voie.,
          }
        complement:
          {
            type: string,
            maxLength: 200,
            description: "Complément d'adresse (bâtiment, étage…), facultatif.",
          }
        postalCode: { type: string, description: Code postal. }
        city: { type: string, maxLength: 100, description: Commune. }
        country:
          type: string
          description: Code pays ISO 3166-1 alpha-2, en majuscules.
          example: FR

    RegisterRequest:
      type: object
      required:
        [
          civility,
          firstName,
          lastName,
          birthDate,
          email,
          mobilePhone,
          address,
          password,
        ]
      additionalProperties: false
      properties:
        civility:
          {
            type: string,
            enum: [madame, monsieur, non-precise],
            description: Civilité.,
          }
        firstName: { type: string, description: Prénom. }
        lastName: { type: string, description: Nom de famille. }
        birthDate:
          type: string
          format: date
          description: Date ISO AAAA-MM-JJ, ni future ni antérieure à 120 ans.
        email:
          {
            type: string,
            format: email,
            description: "Adresse email, unique : elle sert d'identifiant de connexion.",
          }
        mobilePhone:
          type: string
          description: Mobile français (06 ou 07) ou international (+33…). Les espaces, points et tirets sont ignorés.
        address: { $ref: "#/components/schemas/Address" }
        password:
          type: string
          format: password
          description: Au moins 10 caractères, avec une minuscule, une majuscule et un chiffre.

    RegisterResponse:
      type: object
      required: [user, activationRequired]
      properties:
        user: { $ref: "#/components/schemas/UserView" }
        activationRequired:
          type: boolean
          enum: [true]
          description: "Toujours vrai : le compte doit être activé par le lien reçu par mail avant toute connexion."

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: Jeton du lien reçu par mail. }

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          {
            type: string,
            format: email,
            description: Adresse email du compte concerné.,
          }

    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Adresse email, ou pseudo pour un super-héros.
        password: { type: string, format: password }
        rememberMe:
          type: boolean
          description: Prolonge la session (sans effet pour un modérateur).

    LoginResponse:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/UserView" }
        csrfToken:
          type: string
          description: À renvoyer dans `X-CSRF-Token` sur les écritures authentifiées.
        expiresAt:
          type: string
          format: date-time
          description: Durée de vie maximale de la session.

    MeResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user: { $ref: "#/components/schemas/UserView" }
        csrfToken:
          type: string
          description: Jeton CSRF à jour, à renvoyer dans `X-CSRF-Token` sur les écritures authentifiées.

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token:
          {
            type: string,
            description: Jeton du lien de réinitialisation reçu par mail.,
          }
        newPassword:
          type: string
          format: password
          description: Au moins 10 caractères, avec une minuscule, une majuscule et un chiffre.

    HeroRequestPayload:
      type: object
      required: [alias]
      additionalProperties: false
      properties:
        alias:
          type: string
          description: "Pseudo public (2 à 30 caractères : lettres, chiffres, espaces, tirets)."
        bio:
          type: string
          maxLength: 1000
          description: Description publique.
        requestMessage:
          type: string
          maxLength: 2000
          description: Message destiné aux modérateurs, jamais public.

    HeroRequestStatus:
      type: object
      required: [status, alias]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
          description: "`pending` : en attente d'un modérateur ; `approved` : l'utilisateur est super-héros ; `rejected` : refusée."
