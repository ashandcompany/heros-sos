# Développement : tout est joignable depuis la machine, et seulement depuis elle (les ports sont liés à
# 127.0.0.1). Les mots de passe sont ceux, publics, de .env.example : ne jamais les réutiliser ailleurs.
#
#   make up            démarre la pile        http://localhost:8088  (front + API derrière le proxy)
#   make down          l'arrête               http://localhost:8025  (Mailpit : les mails envoyés)
#                                             http://localhost:3001/heros-sos/  (la documentation)
#
# Outils facultatifs : `make adminer` ajoute Adminer (http://localhost:8082).
# `make elk` ajoute le monitoring ELK (Kibana : http://localhost:5601) : 3,3 Go de mémoire et environ 6 Go d'images.
#
# Lancé depuis la racine du dépôt : les chemins sont relatifs à la racine, et l'environnement de l'API
# est lu dans backend/.env (le Makefile le passe aussi à Compose pour les ${…} de ce fichier).

# Même rotation que docker-compose.yml (api, db et proxy la reçoivent de là) pour les services ajoutés ici.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

# Les mails suivent le vrai chemin : l'API les dépose dans RabbitMQ, le worker les relit puis les envoie à Mailpit
# (rien ne part dehors). L'API et le worker lisent la même configuration de mails.
x-mail-environment: &mail-environment
  HEROS_MAIL_DRIVER: smtp
  HEROS_SMTP_HOST: mailpit
  HEROS_SMTP_PORT: "1025"
  HEROS_SMTP_TLS_MODE: none
  HEROS_MAIL_QUEUE: rabbitmq
  HEROS_RABBITMQ_URL: amqp://${RABBITMQ_USER:-heros}:${RABBITMQ_PASSWORD:-heros}@rabbitmq:5672/

services:
  api:
    env_file:
      - backend/.env
    environment:
      <<: *mail-environment
      HEROS_ENV: development
      HEROS_DATABASE_URL: postgres://${POSTGRES_USER:-heros}:${POSTGRES_PASSWORD:-heros}@db:5432/${POSTGRES_DB:-herossos}?sslmode=disable
      # En développement l'API applique elle-même les migrations ; en production, une tâche dédiée.
      HEROS_AUTO_MIGRATE: "true"
      # Le navigateur arrive par le proxy ; le front lancé hors Docker (npm run dev) reste accepté.
      HEROS_ALLOWED_ORIGINS: http://localhost:${PROXY_PORT:-8088},http://localhost:3000
      HEROS_PUBLIC_BASE_URL: http://localhost:${PROXY_PORT:-8088}
      # `make elk` passe les journaux en JSON, que Filebeat sait lire ; sinon, du texte lisible dans un terminal.
      HEROS_LOG_FORMAT: ${HEROS_LOG_FORMAT:-text}
    ports:
      # Accès direct à l'API (curl, outils), sans passer par le proxy.
      - "127.0.0.1:${API_PORT:-8081}:8080"

  # En développement il reçoit le même backend/.env que l'API, par commodité (ces valeurs sont publiques) ; en production
  # il n'a ni la base ni les clés de chiffrement.
  mail-worker:
    env_file:
      - backend/.env
    environment:
      <<: *mail-environment
      HEROS_ENV: development
      HEROS_LOG_FORMAT: ${HEROS_LOG_FORMAT:-text}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heros}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  proxy:
    ports:
      - "127.0.0.1:${PROXY_PORT:-8088}:80"

  web:
    # Étape `dev` de frontend/Dockerfile : les dépendances sont dans l'image (installées une fois,
    # mises en cache), le serveur de développement Next.js démarre aussitôt.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: heros-sos/web:dev
    environment:
      # Les événements de fichiers traversent mal les montages Docker Desktop : on interroge à la place.
      WATCHPACK_POLLING: "true"
      # Le serveur Next appelle l'API directement sur le réseau `edge`, sans repasser par le proxy.
      # Prioritaire sur un API_URL de frontend/.env.local (Next ne remplace pas une variable déjà définie).
      API_URL: http://api:8080/api/v1
      # Adresse du reverse proxy de développement (sitemap, robots.txt, Open Graph).
      SITE_URL: http://localhost:8088
    volumes:
      # Le code de ./frontend est monté et rechargé à chaud…
      - ./frontend:/app
      # …mais les dépendances viennent de l'image, pas de l'hôte (binaires natifs d'un autre système) :
      # ces volumes anonymes masquent les dossiers de l'hôte. `make up` et `make down`
      # les suppriment avec le conteneur (rm -v) : ils suivent ainsi les changements de dépendances.
      - /app/node_modules
      - /app/.next
    networks:
      edge:
        ipv4_address: ${WEB_IP:-172.30.0.3}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Site de documentation (Docusaurus) : http://localhost:3001/heros-sos/. Pas de dépendance : il tourne
  # seul, avec ou sans l'API. Voir docs-site/Dockerfile.
  docs:
    build:
      context: ./docs-site
      dockerfile: Dockerfile
      target: dev
    image: heros-sos/docs:dev
    environment:
      # Les événements de fichiers traversent mal les montages Docker Desktop : on interroge à la place.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # Le code du site est monté et rechargé à chaud…
      - ./docs-site:/app/docs-site
      # …mais les dépendances viennent de l'image, où elles sont dans /app/node_modules (un niveau plus
      # haut : voir docs-site/Dockerfile), et les dossiers générés (cache Docusaurus, pages d'API) restent
      # dans le conteneur. Ces volumes anonymes masquent ceux de l'hôte (binaires d'un autre système) ;
      # celui de node_modules démarre vide, il ne recopie pas 1,4 Go. `make up` et `make down` les
      # suppriment avec le conteneur (rm -v).
      - /app/docs-site/node_modules
      - /app/docs-site/.docusaurus
      - /app/docs-site/docs/api
      # Ce que le site lit dans backend/ (les trois documents et l'OpenAPI) et dans frontend/ (README et
      # docs/*.md), copié par docs-sync ci-dessous.
      - docs-source:/app/backend:ro
      - docs-frontend:/app/frontend:ro
    depends_on:
      docs-sync:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCS_PORT:-3001}:3001"
    networks:
      - edge
    restart: unless-stopped
    logging: *logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/heros-sos/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # Recopie, toutes les 2 secondes, les seuls fichiers de backend/ et de frontend/ que lit la
  # documentation, dans des volumes que le conteneur `docs` monte en lecture seule. Deux pièges évités :
  #   - monter ces fichiers un par un dans `docs` casse dès qu'un éditeur enregistre en remplaçant le
  #     fichier : le conteneur garde l'ancien fichier supprimé et le site perd la page ;
  #   - monter backend/ ou frontend/ en entier donnerait les .env (clés de chiffrement) à `docs`, qui
  #     exécute des centaines de paquets tiers.
  # Ce conteneur-ci voit backend/ et frontend/ (en lecture seule) mais n'exécute qu'un script fixe, sans npm.
  docs-sync:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        mkdir -p /dst/openapi /dst/tables /dst/stack /dst-frontend/docs
        cd /src  # pour que les motifs stack/*.md et tables/*.md ci-dessous se développent dans backend/
        while true; do
          # Les pages avant les index qui les citent : un lien vers une page absente fait échouer la compilation.
          for f in stack/*.md tables/*.md STACK.md MVP.md TABLES.md openapi/openapi.yaml; do
            [ -f "/src/$$f" ] || continue
            cmp -s "/src/$$f" "/dst/$$f" || cp "/src/$$f" "/dst/$$f"
          done
          for f in /src-frontend/README.md /src-frontend/docs/*.md; do
            [ -f "$$f" ] || continue
            d="/dst-frontend/$${f#/src-frontend/}"
            cmp -s "$$f" "$$d" || cp "$$f" "$$d"
          done
          # Un document supprimé ou renommé dans frontend/docs/ disparaît aussi du site.
          for d in /dst-frontend/docs/*.md; do
            [ -f "$$d" ] || continue
            [ -f "/src-frontend/docs/$${d##*/}" ] || rm -f "$$d"
          done
          # Le conteneur `docs` tourne en utilisateur non root et doit pouvoir lire, même si un fichier de
          # l'hôte a des droits restreints (umask 077, fichier créé par un outil…).
          chmod -R a+rX /dst /dst-frontend
          sleep 2
        done
    volumes:
      - ./backend:/src:ro
      - docs-source:/dst
      - ./frontend:/src-frontend:ro
      - docs-frontend:/dst-frontend
    restart: unless-stopped
    logging: *logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Aucun besoin de réseau : il ne fait que copier des fichiers.
    network_mode: none
    healthcheck:
      # `docs` n'attend que ce test : les deux sources doivent être copiées avant son démarrage.
      test: ["CMD-SHELL", "test -f /dst/openapi/openapi.yaml && test -f /dst-frontend/README.md"]
      interval: 2s
      timeout: 2s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # La file des mails : l'API y dépose (mail.send), le service mail-worker les envoie. Interface de gestion : http://localhost:15672.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-heros}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-heros}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Monitoring ELK (profil `elk`, `make elk`) ------------------------------------------------------------
  # Filebeat lit les journaux JSON de l'API, Logstash les trie (et retire ce qui est personnel), Elasticsearch les
  # stocke, Kibana les affiche. Démonstration locale : la sécurité d'Elasticsearch est désactivée, tous les ports
  # sont liés à 127.0.0.1, et rien de tout cela n'existe en production (voir backend/stack/performance-et-synchronisation.md).
  # Les quatre images sont à la même version : ELASTIC_VERSION.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.3.1}
    profiles: ["elk"]
    restart: unless-stopped
    logging: *logging
    environment:
      discovery.type: single-node
      # Démonstration locale uniquement : en production, la sécurité (mot de passe, TLS) est activée.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      # Sur un disque presque plein (portable), Elasticsearch passerait ses index en lecture seule dès 85 % d'usage.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - backend
    healthcheck:
      # `status.{3}` : les trois caractères (":") entre la clé et la valeur du JSON.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -q -E 'status.{3}(green|yellow)'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-9.3.1}
    profiles: ["elk"]
    restart: unless-stopped
    logging: *logging
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./backend/docker/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - backend
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.3.1}
    profiles: ["elk"]
    restart: unless-stopped
    logging: *logging
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    networks:
      - backend
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q -E 'level.{3}available'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-9.3.1}
    profiles: ["elk"]
    restart: unless-stopped
    logging: *logging
    # Root pour lire les fichiers de journaux de Docker (non lisibles par un autre utilisateur).
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./backend/docker/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - backend
    depends_on:
      - logstash

  # Tâche unique : modèles d'index, cycle de vie, vues de données et dashboard Kibana. Réutilise l'image de Kibana
  # (curl et bash y sont déjà) plutôt que d'en télécharger une autre.
  elk-setup:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.3.1}
    profiles: ["elk"]
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/bash", "/elk/setup.sh"]
    environment:
      KIBANA_PORT: ${KIBANA_PORT:-5601}
    volumes:
      - ./backend/docker/elk:/elk:ro
    networks:
      - backend
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy

  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: unless-stopped
    logging: *logging
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    networks:
      - backend

networks:
  backend:
    # Le réseau `backend` est fermé en production ; en développement les ports publiés ont besoin
    # d'une passerelle vers l'hôte.
    internal: false

volumes:
  rabbitmq_data:
  # Index d'Elasticsearch (profil `elk`).
  esdata:
  # Copie des documents de backend/ lus par la documentation (voir docs-sync).
  docs-source:
  # Copie des documents de frontend/ lus par la documentation (voir docs-sync).
  docs-frontend:
