openapi: 3.0.3

info:
  title: Heros-SOS API
  version: 0.1.0
  description: |
    API de la plateforme Heros-SOS : authentification, demandes de statut de super-héros et
    modération des comptes.

    **Ce fichier est la référence du contrat** (spec d'abord). Les tests de bout en bout du
    backend valident chaque requête et chaque réponse contre lui, et vérifient que les routes
    enregistrées sont exactement celles décrites ici : une route ou un statut non documenté
    fait échouer les tests.

    ## Essayer l'API depuis cette page

    Cette page n'existe qu'en développement et parle à la vraie API, sur la même origine que le
    site. Pour parcourir le cycle complet d'un compte :

    1. **Inscription** : `POST /auth/register` puis **Try it out**. L'exemple est valide ;
       changez l'adresse email à chaque essai (sinon `email_already_used`).
    2. **Activation** : le mail d'activation est reçu dans Mailpit (http://localhost:8025 avec
       `make up-dev`). Copiez le `token` du lien, puis `POST /auth/activate`.
    3. **Connexion** : `POST /auth/login`. Le navigateur conserve le cookie de session ; copiez le
       `csrfToken` de la réponse.
    4. **Écritures authentifiées** : cliquez sur **Authorize**, collez le `csrfToken` dans la case
       `csrfToken` (laissez `sessionCookie` vide : le navigateur l'envoie tout seul), puis
       essayez la route.
    5. **Routes `/admin`** : elles demandent un compte modérateur, créé en ligne de commande avec
       `make moderator-dev`.

    ## Rôles

    | Rôle | Qui | Ce qu'il peut faire |
    |---|---|---|
    | `citizen` | tout compte activé | demander le statut de super-héros et suivre sa demande ; gérer son profil (`/me`) |
    | `hero` | citoyen accepté par un modérateur | idem ; une nouvelle demande répond `already_hero` |
    | `moderator` | créé en ligne de commande, avec la **double authentification (TOTP)** obligatoire en production | décider des demandes, lister, désactiver, réactiver et vérifier les comptes ; valider les changements d'adresse email (une fois l'adresse confirmée par son titulaire) |

    ## Pagination

    Les listes (`/admin/…`) acceptent `limit` (1 à 100, 20 par défaut) et `offset`. La réponse
    contient `items`, `total`, `limit` et `offset`.

    ## Session et CSRF

    La session est un cookie opaque (`HttpOnly`, `SameSite=Lax`, sans `Domain`) posé par
    `POST /auth/login`. Son nom est `__Host-session` en production (HTTPS) et `session` en
    développement. Le jeton est aléatoire et n'est jamais lisible en JavaScript.

    Toute requête **authentifiée qui modifie des données** (POST, PUT, PATCH, DELETE) doit porter
    l'en-tête `X-CSRF-Token`, dont la valeur est le champ `csrfToken` renvoyé par `POST /auth/login`
    et `GET /auth/me`. Toute requête qui modifie des données doit aussi venir d'une origine
    autorisée : l'en-tête `Origin`, s'il est présent, doit figurer dans la liste du serveur.

    ## Erreurs

    Toutes les erreurs ont la forme `{"error": {"code", "message", "fields"?}}`. Le `code` est
    stable et sert au frontend ; le `message` est destiné à l'affichage. Les erreurs de
    validation (422) détaillent les champs : `fields` associe un nom de champ à un code
    (`required`, `invalid`, `too_short`, `too_long`, `weak`).

    | Code | Statut | Quand |
    |---|---|---|
    | `bad_request` | 400 | JSON invalide, champ inconnu, corps vide |
    | `invalid_token` | 400 | lien (activation, réinitialisation, confirmation ou désinscription de la newsletter, confirmation d'adresse) invalide, expiré ou déjà utilisé |
    | `unauthenticated` | 401 | session absente ou expirée |
    | `invalid_credentials` | 401 | identifiant ou mot de passe incorrect |
    | `origin_not_allowed` | 403 | `Origin` absente de la liste du serveur (écritures) |
    | `csrf_invalid` | 403 | en-tête `X-CSRF-Token` absent ou invalide |
    | `mfa_required` | 403 | session limitée : la double authentification doit d'abord être validée ou activée (voir `GET /auth/mfa`) |
    | `forbidden` | 403 | rôle insuffisant |
    | `protected_account` | 403 | action interdite sur un compte de modérateur |
    | `account_not_activated` | 403 | compte pas encore activé (révélé avec le bon mot de passe) |
    | `account_deactivated` | 403 | compte désactivé (révélé avec le bon mot de passe) |
    | `hero_request_not_eligible` | 403 | compte qui ne peut pas faire de demande (modérateur) |
    | `not_found` | 404 | ressource ou route introuvable |
    | `hero_request_not_found` | 404 | aucune demande déposée par l'utilisateur |
    | `email_change_not_found` | 404 | demande de changement d'adresse inconnue, ou remplacée par son titulaire |
    | `email_already_used` | 409 | adresse email déjà inscrite (inscription, changement d'adresse) |
    | `email_unchanged` | 409 | la nouvelle adresse demandée est déjà celle du compte |
    | `email_change_not_pending` | 409 | demande de changement d'adresse déjà traitée |
    | `email_change_not_confirmed` | 409 | la nouvelle adresse n'a pas encore été confirmée par son titulaire : la demande ne peut pas être acceptée |
    | `mfa_already_enabled` | 409 | double authentification déjà activée (elle ne se réinitialise pas par l'API) |
    | `mfa_not_set_up` | 409 | double authentification pas (encore) configurée pour ce compte |
    | `hero_request_pending` | 409 | demande déjà en attente |
    | `already_hero` | 409 | utilisateur déjà super-héros |
    | `alias_already_used` | 409 | pseudo déjà pris |
    | `hero_request_not_pending` | 409 | demande déjà traitée |
    | `self_action_forbidden` | 409 | action interdite sur son propre compte |
    | `payload_too_large` | 413 | corps de requête trop volumineux |
    | `unsupported_media_type` | 415 | corps qui n'est pas en `application/json` (ou, pour `PUT /me/avatar`, pas une image JPEG, PNG ou WebP) |
    | `validation_failed` | 422 | données invalides ; `fields` détaille chaque champ |
    | `rate_limited` | 429 | trop de requêtes ; `Retry-After` indique le délai |
    | `account_locked` | 429 | compte verrouillé après plusieurs échecs ; `Retry-After` indique le délai |
    | `internal_error` | 500 | erreur interne, sans détail |
    | `contact_delivery_unavailable` | 503 | message de contact non confié au service d'envoi : réessayer |
  contact:
    name: Équipe Heros-SOS
    url: https://github.com/ashandcompany/heros-sos

servers:
  - url: /api/v1
    description: Même origine que le site (le reverse proxy route /api/v1 vers l'API).

tags:
  - name: Santé
    description: Sondes de vie et de disponibilité, utilisées par Docker et la supervision. Publiques, sans session.
  - name: Authentification
    description: Inscription, activation par mail, connexion par cookie de session, déconnexion et réinitialisation du mot de passe.
  - name: Super-héros
    description: Demande du statut de super-héros par un citoyen connecté, et suivi de cette demande.
  - name: Modération
    description: Réservé aux modérateurs. Décision sur les demandes de statut de super-héros et gestion des comptes (désactiver, réactiver, vérifier).
  - name: Incidents
    description: "Déclaration et consultation des incidents, puis cycle d'une intervention : démarrer, rejoindre ou inviter des héros, proposer et valider le résultat."
  - name: Types d'intervention
    description: "Les types d'incident (catégories) proposés à la déclaration. Les modérateurs les gèrent sous `/admin`."
  - name: Vilains
    description: Les super-vilains que l'on peut associer à un incident. Tout utilisateur connecté peut en déclarer un et modifier ses spécialités.
  - name: Réputation
    description: Notes des citoyens après intervention, réponses des héros et modération des avis.
  - name: Films
    description: Catalogue OMDb, vidéothèques des héros, associations des vilains et modération.
  - name: Compte
    description: "Profil de l'utilisateur connecté (citoyen ou super-héros) : coordonnées, photo, changement d'adresse email soumis à un modérateur, préférence de newsletter."
  - name: Contact et newsletter
    description: "Formulaires publics qui passent par le Mailer, sans session : message à l'équipe et abonnement à la newsletter (double opt-in)."
  - name: Blog
    description: |
      Articles du blog. Tout le monde lit les articles publiés ; les modérateurs les rédigent sous
      `/admin/articles` et voient aussi les brouillons. Le contenu est du HTML limité aux balises
      de l'éditeur (`p`, `br`, `h2`, `h3`, `strong`, `em`, `s`, `ul`, `ol`, `li`, `blockquote`,
      `hr`, `a`), assaini par l'API à l'enregistrement.

paths:
  /me/interventions:
    get:
      tags: [Réputation]
      summary: Interventions terminées à noter
      description: Liste les héros confirmés des interventions clôturées sur les incidents déclarés par l'utilisateur connecté (citoyen ou héros), avec ses avis déjà déposés. Un héros déclarant ne peut pas se noter lui-même.
      operationId: listMyRateableInterventions
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Interventions et héros susceptibles d'être notés.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateableInterventionPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /interventions/{interventionId}/reviews:
    post:
      tags: [Réputation]
      summary: Noter un héros de l'intervention
      description: Seul le déclarant connecté (citoyen ou héros) peut noter chaque participant confirmé d'une intervention clôturée, une fois par héros; un héros déclarant ne peut pas se noter lui-même. Une note seule est publiée immédiatement; un avis avec commentaire attend la modération.
      operationId: createHeroReview
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: interventionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroReviewPayload" }
      responses:
        "204": { description: Avis créé; une note seule est publiée immédiatement et un avis commenté est placé en attente de modération. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ce héros a déjà été noté pour cette intervention.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/reviews/{reviewId}:
    put:
      tags: [Réputation]
      summary: Modifier son avis
      description: Seul l'auteur connecté peut modifier la note et le commentaire de son avis. Un avis avec commentaire est remis en attente de modération; une note seule est publiée immédiatement.
      operationId: updateMyHeroReview
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroReviewEditPayload" }
      responses:
        "204": { description: Avis modifié. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /hero/reviews:
    get:
      tags: [Réputation]
      summary: Avis reçus par le héros connecté
      description: Le héros voit ses avis et leur statut de modération; un commentaire masqué n'est pas renvoyé.
      operationId: listMyHeroReviews
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Résumé et page des avis reçus; moyenne et compteur basés sur les avis publiés uniquement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeroReputation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /hero/reviews/{reviewId}/reply:
    put:
      tags: [Réputation]
      summary: Répondre à un avis ou modifier sa réponse
      description: Seul le héros évalué peut répondre. La réponse est publiée à sa création; chaque modification la remet en attente de modération.
      operationId: saveHeroReviewReply
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroReviewReplyPayload" }
      responses:
        "204": { description: Réponse enregistrée ou modifiée. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: L'avis ne contient pas de commentaire publiable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /heroes/{heroId}/reviews:
    get:
      tags: [Réputation]
      summary: Avis publics d'un héros
      description: Retourne uniquement les avis publiés et calcule la moyenne sur tous les avis publiés, indépendamment de la pagination.
      operationId: listPublicHeroReviews
      parameters:
        - name: heroId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Moyenne et page d'avis publics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicHeroReputation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/hero-reviews:
    get:
      tags: [Réputation]
      summary: Lister les avis à modérer
      operationId: listHeroReviewsForModeration
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [published, pending, hidden] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Page d'avis avec leurs réponses éventuelles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeroReviewPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/hero-reviews/{reviewId}:
    patch:
      tags: [Réputation]
      summary: Publier ou masquer un avis
      operationId: moderateHeroReview
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroReviewStatusPayload" }
      responses:
        "204": { description: Modération enregistrée. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/hero-review-replies:
    get:
      tags: [Réputation]
      summary: Lister les réponses à modérer
      operationId: listHeroReviewRepliesForModeration
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [published, pending, hidden] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Page de réponses et avis associés.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/HeroReviewReplyModerationPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/hero-review-replies/{reviewId}:
    patch:
      tags: [Réputation]
      summary: Publier ou masquer une réponse
      operationId: moderateHeroReviewReply
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroReviewStatusPayload" }
      responses:
        "204": { description: Modération enregistrée. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /health:
    get:
      tags: [Santé]
      summary: Le processus répond
      description: |
        Sonde de vie : répond 200 tant que le processus tourne, sans interroger la base de données.
        Utilisée par le reverse proxy pour surveiller l'API.
      operationId: health
      responses:
        "200":
          description: Le serveur est en vie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [Santé]
      summary: La base de données répond
      description: |
        Sonde de disponibilité : interroge la base de données, avec un délai borné. Répond 200 si
        elle répond, 503 sinon. C'est ce que vérifie le contrôle de santé du conteneur
        (`api -healthcheck`).
      operationId: ready
      responses:
        "200":
          description: Le serveur est prêt à recevoir du trafic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                pret:
                  summary: La base de données répond
                  value:
                    status: ok
        "503":
          description: La base de données ne répond pas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                indisponible:
                  summary: La base de données ne répond pas
                  value:
                    status: unavailable

  /auth/register:
    post:
      tags: [Authentification]
      summary: Inscription d'un citoyen
      description: |
        Crée un compte citoyen **en attente d'activation** et envoie un mail contenant le lien
        d'activation. Aucune session n'est ouverte : il faut activer le compte puis se connecter.
        Aucun rôle n'est choisi ici ; le statut de super-héros se demande ensuite via
        `POST /heroes/requests`.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            examples:
              citoyen:
                summary: Un citoyen (changez l'adresse email à chaque essai)
                value:
                  civility: madame
                  firstName: Natasha
                  lastName: Romanoff
                  birthDate: "1984-11-22"
                  email: natasha.romanoff@example.org
                  mobilePhone: 06 12 34 56 78
                  address:
                    street: 10 rue de Rivoli
                    postalCode: "75004"
                    city: Paris
                    country: FR
                  password: MotDePasse2026
      responses:
        "201":
          description: Compte créé, en attente d'activation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
              examples:
                compte-cree:
                  summary: Compte créé, en attente d'activation
                  value:
                    user:
                      id: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
                      displayName: Natasha
                      role: citizen
                      email: natasha.romanoff@example.org
                    activationRequired: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Cette adresse email est déjà utilisée (`email_already_used`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                email-deja-utilisee:
                  summary: Adresse déjà inscrite
                  value:
                    error:
                      code: email_already_used
                      message: Cette adresse email est déjà utilisée.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/activate:
    post:
      tags: [Authentification]
      summary: Activation du compte
      description: Active le compte avec le jeton du lien reçu par mail. Un jeton ne sert qu'une fois.
      operationId: activate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
            examples:
              lien-recu:
                summary: Le jeton du lien reçu par mail (à remplacer)
                value:
                  token: collez-ici-le-jeton-du-lien-recu-par-mail
      responses:
        "204": { description: Compte activé. }
        "400": { $ref: "#/components/responses/BadRequestOrInvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/resend-activation:
    post:
      tags: [Authentification]
      summary: Renvoyer le lien d'activation
      description: |
        Envoie un nouveau lien si l'adresse correspond à un compte en attente d'activation (les
        liens précédents sont invalidés). La réponse est identique dans tous les cas : elle ne
        révèle pas quelles adresses ont un compte.
      operationId: resendActivation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
            examples:
              compte-en-attente:
                summary: L'adresse d'un compte pas encore activé
                value:
                  email: natasha.romanoff@example.org
      responses:
        "202": { description: Demande prise en compte. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion
      description: |
        Authentifie par adresse email, ou par pseudo pour un super-héros, et ouvre une session
        (cookie). Un identifiant inconnu et un mauvais mot de passe donnent exactement la même
        réponse (`invalid_credentials`). Les états « non activé » et « désactivé » ne sont annoncés
        qu'avec le bon mot de passe. Après plusieurs échecs, le compte est verrouillé pour une
        durée croissante (`account_locked`, avec `Retry-After`).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              citoyen:
                summary: Connexion par adresse email
                value:
                  identifier: natasha.romanoff@example.org
                  password: MotDePasse2026
                  rememberMe: false
      responses:
        "200":
          description: Connecté. Le cookie de session est posé.
          headers:
            Set-Cookie:
              description: Cookie de session (`HttpOnly`, `SameSite=Lax`, `Path=/`).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              examples:
                connecte:
                  summary: "Connecté : copiez csrfToken dans Authorize"
                  value:
                    user:
                      id: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
                      displayName: Natasha
                      role: citizen
                      email: natasha.romanoff@example.org
                    csrfToken: t3rS7fGZpLRHk0evrzh9Q1oSSA0NxbjgQsTImRWH0IA
                    expiresAt: "2026-10-27T10:30:00Z"
                    mfa: not_enrolled
                moderateur-2fa:
                  summary: "Modérateur : session limitée, le code de double authentification reste à saisir"
                  value:
                    user:
                      id: 5b1f7c0e-2a4d-4b8e-9d63-1c7a8e2f4b90
                      displayName: Nick
                      role: moderator
                      email: nick.fury@example.org
                    csrfToken: t3rS7fGZpLRHk0evrzh9Q1oSSA0NxbjgQsTImRWH0IA
                    expiresAt: "2026-10-22T18:30:00Z"
                    mfa: verification_required
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Identifiant ou mot de passe incorrect (`invalid_credentials`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                identifiants-incorrects:
                  summary: Identifiant ou mot de passe incorrect
                  value:
                    error:
                      code: invalid_credentials
                      message: Identifiant ou mot de passe incorrect.
        "403":
          description: Origine non autorisée, compte non activé (`account_not_activated`) ou désactivé (`account_deactivated`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                compte-non-active:
                  summary: Compte pas encore activé
                  value:
                    error:
                      code: account_not_activated
                      message: "Votre compte n'est pas encore activé : consultez le mail d'activation."
                compte-desactive:
                  summary: Compte désactivé
                  value:
                    error:
                      code: account_deactivated
                      message: Ce compte a été désactivé.
                origine:
                  summary: Origine non autorisée
                  value:
                    error:
                      code: origin_not_allowed
                      message: Origine non autorisée.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Déconnexion de l'appareil courant
      description: Ferme la session de cet appareil et efface le cookie. Les sessions des autres appareils restent ouvertes.
      operationId: logout
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "204":
          description: Session fermée, cookie effacé.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout-all:
    post:
      tags: [Authentification]
      summary: Déconnexion de tous les appareils
      description: Ferme toutes les sessions de l'utilisateur, sur tous ses appareils, celle-ci comprise.
      operationId: logoutAll
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "204":
          description: Toutes les sessions de l'utilisateur sont fermées.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/me:
    get:
      tags: [Authentification]
      summary: Utilisateur courant
      description: |
        Retourne l'utilisateur de la session et un jeton CSRF à jour. Le frontend s'en sert pour
        rediriger selon le rôle et pour récupérer le jeton CSRF après un rechargement de page.
      operationId: me
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: L'utilisateur de la session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
              examples:
                connecte:
                  summary: L'utilisateur de la session
                  value:
                    user:
                      id: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
                      displayName: Natasha
                      role: citizen
                      email: natasha.romanoff@example.org
                    csrfToken: t3rS7fGZpLRHk0evrzh9Q1oSSA0NxbjgQsTImRWH0IA
                    mfa: not_enrolled
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/mfa:
    get:
      tags: [Authentification]
      summary: État de la double authentification
      description: |
        Où en est la double authentification de la session, et combien de codes de secours restent. Une
        session **limitée** (`verification_required`, `enrollment_required`) peut l'appeler.
      operationId: getMfaStatus
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: L'état de la double authentification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatusResponse" }
              examples:
                activee:
                  summary: Activée et validée pour cette session
                  value:
                    status: verified
                    recoveryCodesRemaining: 9
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/mfa/setup:
    post:
      tags: [Authentification]
      summary: Commencer l'activation de la double authentification
      description: |
        Réservé aux modérateurs. Tire un secret TOTP et le rend, pour le configurer dans une application
        d'authentification (Google Authenticator, Aegis, 1Password…) : `otpauthUrl` s'ouvre dans l'application
        (lien ou QR code), `secret` se saisit à la main. La double authentification n'est active qu'une fois
        confirmée par un premier code (`POST /auth/mfa/enable`) ; recommencer remplace le secret d'une
        activation non confirmée. Une double authentification **déjà activée** ne se réinitialise pas par
        l'API (`mfa_already_enabled`) : un compte piraté ne doit pas pouvoir remplacer sa propre protection ;
        l'exploitation la réinitialise (`make resetmfa-dev`).

        Une session **limitée** peut l'appeler.
      operationId: setupMfa
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200":
          description: Le secret à configurer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaSetupResponse" }
              examples:
                secret:
                  summary: Le secret et son adresse otpauth
                  value:
                    secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                    otpauthUrl: "otpauth://totp/Heros-SOS:nick.fury@example.org?algorithm=SHA1&digits=6&issuer=Heros-SOS&period=30&secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: La double authentification est déjà activée (`mfa_already_enabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                deja-activee:
                  summary: Déjà activée
                  value:
                    error:
                      code: mfa_already_enabled
                      message: La double authentification est déjà activée.
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/mfa/enable:
    post:
      tags: [Authentification]
      summary: Activer la double authentification
      description: |
        Réservé aux modérateurs. Le premier code de l'application confirme l'activation. La réponse donne
        **les codes de secours, montrés cette seule fois** (à garder hors ligne : chacun remplace un code TOTP
        une fois), et ouvre une **session complète avec un nouveau cookie et un nouveau jeton CSRF** : les
        autres sessions du compte sont fermées, celles ouvertes avant n'ayant jamais passé le second facteur.

        Un code faux compte comme un échec de connexion (verrouillage progressif du compte).

        Une session **limitée** peut l'appeler.
      operationId: enableMfa
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
            examples:
              premier-code:
                summary: Le code à 6 chiffres affiché par l'application
                value:
                  code: "123456"
      responses:
        "200":
          description: Double authentification activée ; session complète.
          headers:
            Set-Cookie:
              description: Le nouveau cookie de session (le précédent est révoqué).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnabledResponse" }
              examples:
                activee:
                  summary: Activée, avec ses codes de secours
                  value:
                    user:
                      id: 5b1f7c0e-2a4d-4b8e-9d63-1c7a8e2f4b90
                      displayName: Nick
                      role: moderator
                      email: nick.fury@example.org
                    csrfToken: t3rS7fGZpLRHk0evrzh9Q1oSSA0NxbjgQsTImRWH0IA
                    expiresAt: "2026-10-22T18:30:00Z"
                    mfa: verified
                    recoveryCodes:
                      - K3JV-7QXD-W2MP-RT4N
                      - 6BHE-ZC5S-LN9A-YG2F
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: La double authentification est déjà activée (`mfa_already_enabled`), ou son activation n'a pas été commencée (`mfa_not_set_up`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                pas-commencee:
                  summary: Aucun secret en attente
                  value:
                    error:
                      code: mfa_not_set_up
                      message: La double authentification n'est pas configurée.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: Code absent (`required`) ou faux, périmé ou déjà utilisé (`invalid`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                code-faux:
                  summary: Code faux
                  value:
                    error:
                      code: validation_failed
                      message: Certaines informations sont invalides.
                      fields:
                        code: invalid
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/mfa/verify:
    post:
      tags: [Authentification]
      summary: Valider la double authentification
      description: |
        Pour un compte qui a activé la double authentification, la session ouverte par `POST /auth/login`
        est **limitée** (`mfa: verification_required`) : elle ne donne accès qu'à cette route, à l'état de la
        session et à la déconnexion (toute autre route répond `mfa_required`). Un code de l'application
        (`code`), ou à défaut un code de secours (`recoveryCode`, à usage unique), ouvre une **session
        complète avec un nouveau cookie et un nouveau jeton CSRF**.

        Un code TOTP ne sert qu'une fois. Un code faux compte comme un échec de connexion : après quelques-uns,
        le compte est verrouillé avec un délai croissant (`account_locked`, 429) et ses sessions sont fermées.
        Le mot de passe seul ne remet pas ce compteur à zéro, pour qu'on ne puisse pas alterner connexion et
        devinette.
      operationId: verifyMfa
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
            examples:
              code:
                summary: Le code à 6 chiffres de l'application
                value:
                  code: "123456"
              secours:
                summary: Un code de secours (appareil perdu)
                value:
                  recoveryCode: K3JV-7QXD-W2MP-RT4N
      responses:
        "200":
          description: Session complète.
          headers:
            Set-Cookie:
              description: Le nouveau cookie de session (le précédent est révoqué).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
              examples:
                valide:
                  summary: Session complète
                  value:
                    user:
                      id: 5b1f7c0e-2a4d-4b8e-9d63-1c7a8e2f4b90
                      displayName: Nick
                      role: moderator
                      email: nick.fury@example.org
                    csrfToken: t3rS7fGZpLRHk0evrzh9Q1oSSA0NxbjgQsTImRWH0IA
                    expiresAt: "2026-10-22T18:30:00Z"
                    mfa: verified
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: La double authentification n'est pas activée pour ce compte (`mfa_not_set_up`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                pas-activee:
                  summary: Pas de 2FA
                  value:
                    error:
                      code: mfa_not_set_up
                      message: La double authentification n'est pas configurée.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: Aucun code (`required`), ou code faux, périmé, déjà utilisé (`invalid`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                code-faux:
                  summary: Code faux
                  value:
                    error:
                      code: validation_failed
                      message: Certaines informations sont invalides.
                      fields:
                        code: invalid
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/mfa/recovery-codes:
    post:
      tags: [Authentification]
      summary: Régénérer les codes de secours
      description: |
        Réservé aux modérateurs, avec une **session complète**. Remplace tous les codes de secours (utilisés
        ou non) par de nouveaux, montrés cette seule fois. Demande le code TOTP courant : une session volée ne
        suffit pas à s'en procurer.
      operationId: regenerateMfaRecoveryCodes
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
            examples:
              code:
                summary: Le code à 6 chiffres de l'application
                value:
                  code: "123456"
      responses:
        "200":
          description: Les nouveaux codes de secours.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesResponse" }
              examples:
                nouveaux:
                  summary: Dix nouveaux codes
                  value:
                    recoveryCodes:
                      - K3JV-7QXD-W2MP-RT4N
                      - 6BHE-ZC5S-LN9A-YG2F
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: La double authentification n'est pas activée (`mfa_not_set_up`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                pas-activee:
                  summary: Pas de 2FA
                  value:
                    error:
                      code: mfa_not_set_up
                      message: La double authentification n'est pas configurée.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: Code absent (`required`) ou faux (`invalid`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                code-faux:
                  summary: Code faux
                  value:
                    error:
                      code: validation_failed
                      message: Certaines informations sont invalides.
                      fields:
                        code: invalid
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/password-reset:
    post:
      tags: [Authentification]
      summary: Demander la réinitialisation du mot de passe
      description: |
        Envoie un lien à l'adresse si elle correspond à un compte actif (les liens précédents sont
        invalidés). La réponse est identique pour une adresse inconnue : elle ne révèle rien.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
            examples:
              compte:
                summary: L'adresse du compte
                value:
                  email: natasha.romanoff@example.org
      responses:
        "202": { description: Demande prise en compte. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/password-reset/confirm:
    post:
      tags: [Authentification]
      summary: Choisir un nouveau mot de passe
      description: |
        Change le mot de passe avec le jeton reçu par mail et ferme toutes les sessions de
        l'utilisateur. Un mot de passe trop faible est refusé (422) **sans consommer le jeton**.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmRequest" }
            examples:
              lien-recu:
                summary: Le jeton du lien reçu par mail (à remplacer)
                value:
                  token: collez-ici-le-jeton-du-lien-recu-par-mail
                  newPassword: NouveauMotDePasse2026
      responses:
        "204": { description: Mot de passe changé. }
        "400": { $ref: "#/components/responses/BadRequestOrInvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /heroes:
    get:
      tags: [Super-héros]
      summary: Lister les super-héros publics
      description: |
        Liste les profils dont la demande est approuvée et dont le compte est actif. La réponse
        n'expose aucune identité civile. `power` reprend la description publique (`bio`) du profil;
        `avatarUrl` n'est renseigné que si `avatar_path` contient une référence publiquement exploitable.
      operationId: listPublicHeroes
      parameters:
        - name: sort
          in: query
          description: "Ordre de tri : pseudo croissant par défaut, ou note moyenne décroissante."
          schema:
            { type: string, enum: [alias, -averageRating], default: alias }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Une page de profils publics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicHeroPage" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /heroes/{heroId}:
    get:
      tags: [Super-héros]
      summary: Consulter la fiche publique d'un super-héros
      description: |
        Retourne la fiche d'un héros approuvé avec un compte actif. Les données civiles et les
        chemins de stockage internes ne sont jamais exposés.
      operationId: getPublicHero
      parameters:
        - { $ref: "#/components/parameters/HeroId" }
      responses:
        "200":
          description: Fiche publique du super-héros.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicHero" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /heroes/requests:
    post:
      tags: [Super-héros]
      summary: Demander le statut de super-héros
      description: |
        Dépose la demande d'un citoyen actif. Elle reste « en attente » jusqu'à la décision d'un
        modérateur. Une demande refusée peut être redéposée.
      operationId: requestHeroStatus
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeroRequestPayload" }
            examples:
              demande:
                summary: Une demande avec pseudo, description et message
                value:
                  alias: Veuve Noire
                  bio: Ancienne espionne, spécialiste de l'infiltration.
                  requestMessage: Je peux fournir mes états de service sur demande.
      responses:
        "201":
          description: Demande enregistrée, en attente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeroRequestStatus" }
              examples:
                en-attente:
                  summary: Demande enregistrée
                  value:
                    status: pending
                    alias: Veuve Noire
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Origine non autorisée, jeton CSRF invalide, ou compte non éligible (`hero_request_not_eligible`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                non-eligible:
                  summary: Compte qui ne peut pas faire de demande
                  value:
                    error:
                      code: hero_request_not_eligible
                      message: Votre compte ne peut pas faire cette demande.
                csrf:
                  summary: Jeton CSRF absent ou invalide
                  value:
                    error:
                      code: csrf_invalid
                      message: Jeton CSRF absent ou invalide.
        "409":
          description: Demande déjà en attente (`hero_request_pending`), déjà super-héros (`already_hero`) ou pseudo pris (`alias_already_used`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                deja-en-attente:
                  summary: Demande déjà en attente
                  value:
                    error:
                      code: hero_request_pending
                      message: Une demande est déjà en cours d'examen.
                deja-super-heros:
                  summary: Déjà super-héros
                  value:
                    error:
                      code: already_hero
                      message: Vous êtes déjà super-héros.
                pseudo-pris:
                  summary: Pseudo déjà pris
                  value:
                    error:
                      code: alias_already_used
                      message: Ce pseudo est déjà utilisé.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /heroes/requests/me:
    get:
      tags: [Super-héros]
      summary: État de ma demande
      description: |
        Retourne la demande de l'utilisateur connecté : `pending` (en attente), `approved` ou
