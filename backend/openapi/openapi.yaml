                    status: pending
                    alias: Veuve Noire
                refusee:
                  summary: Demande refusée
                  value:
                    status: rejected
                    alias: Veuve Noire
                    rejectionReason: Le dossier ne permet pas de vérifier l'identité du demandeur.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Aucune demande (`hero_request_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                aucune-demande:
                  summary: Aucune demande n'a été déposée
