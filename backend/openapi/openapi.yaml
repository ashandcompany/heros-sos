      operationId: myHeroRequest
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: La demande de l'utilisateur courant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeroRequestStatus" }
              examples:
                en-attente:
                  summary: Demande en attente
