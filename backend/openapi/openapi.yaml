  /incidents:
    get:
      tags: [Incidents]
      summary: Liste publique des incidents
      description: |
        Accessible sans session. Liste tous les incidents (résolus ou non) sans identité civile du
        déclarant. Les valeurs d'un même filtre sont combinées par OU, les filtres entre eux par ET.
        Les filtres multiples s'écrivent avec un paramètre répété (?status=a&status=b)
        (20 identifiants au maximum pour heroId et villainId).
      operationId: listIncidents
      parameters:
        - name: reporterId
          in: query
          description: Identifiant facultatif du déclarant; un citoyen connecté ne peut filtrer que sur son propre identifiant.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Statuts retenus.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [reported, in_progress, succeeded, failed] }
        - name: heroId
          in: query
          description: Incidents où au moins un de ces héros est intervenu.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, format: uuid }
        - name: villainId
          in: query
          description: Incidents liés à au moins un de ces vilains.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, format: uuid }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - name: cursor
          in: query
          description: |
            Position de la page à lire, telle que renvoyée par `nextCursor` de la page précédente (valeur opaque,
            à renvoyer telle quelle). Elle remplace `offset` (les deux ensemble sont refusés) et coûte autant à la
            millionième page qu'à la première ; elle ne saute ni ne répète d'incident quand de nouveaux incidents
            arrivent entre deux pages.
          schema: { type: string }
      responses:
        "200":
          description: Une page d'incidents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Incidents]
      summary: Déclarer un incident
      description: |
        Tout utilisateur connecté peut déclarer un incident classé par un type existant. Les vilains
        sont facultatifs et plusieurs vilains peuvent être associés. L'adresse est conservée en clair
        pour permettre la détection des doublons prévue par le schéma.
      operationId: createIncident
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ClientCreatedAt" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentPayload" }
      responses:
        "201":
          description: Incident déclaré, à l'état `reported` et à la priorité `normal` par défaut.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: Un incident porte déjà l'identifiant choisi par le client (`incident_already_exists`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Détail public d'un incident
      description: Accessible sans session.
      operationId: getIncident
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: L'incident et ses vilains associés.
          content:
