# Logstash : reçoit les lignes JSON de l'API (via Filebeat), enlève ce qui est personnel, nomme les champs et
# aiguille vers deux index :
#   herossos-logs-AAAA.MM.JJ    journaux applicatifs et journal d'accès (une ligne par requête)
#   herossos-events-AAAA.MM.JJ  événements métier (une ligne par action sur un incident ou une intervention)

input {
  beats {
    port => 5044
  }
}

filter {
  # Le type de ligne se reconnaît à son message : « événement » (journal d'événements), « requête » (accès).
  if [msg] == "événement" {
    mutate {
      add_field => {
        "[event][dataset]" => "herossos.events"
        "[@metadata][target]" => "events"
      }
    }
    # La date d'un événement est celle de son enregistrement, pas celle de son envoi dans les journaux.
    date {
      match => ["recorded_at", "ISO8601"]
      target => "@timestamp"
    }
  } else {
    if [msg] == "requête" {
      mutate { add_field => { "[event][dataset]" => "herossos.access" } }
    } else {
      mutate { add_field => { "[event][dataset]" => "herossos.app" } }
    }
    mutate { add_field => { "[@metadata][target]" => "logs" } }
    date {
      match => ["time", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Les nombres arrivent déjà typés du JSON ; la conversion garantit le type voulu par les index.
  mutate {
    convert => {
      "duration_ms" => "integer"
      "status" => "integer"
      "bytes" => "integer"
      "sync_delay_ms" => "integer"
      "event_seq" => "integer"
      "aggregate_version" => "integer"
    }
  }

  # Rien de personnel dans le monitoring : ni adresse IP, ni texte libre qui s'y glisserait un jour. Les
  # événements ne portent que des identifiants et des états ; ceci est une seconde barrière.
  #
  # [event][original] est la ligne brute telle que Filebeat l'a lue : elle contient encore `"ip":"…"` et tout le
  # payload, que les champs retirés ci-dessous ne couvrent pas. Les champs utiles en sont déjà extraits : on la jette.
  mutate {
    remove_field => [
      "ip", "time", "[event][original]",
      "[payload][description]", "[payload][street]", "[payload][address]", "[payload][email]", "[payload][name]",
      "agent", "ecs", "input", "host", "stream", "[log][offset]", "[log][flags]"
    ]
  }

  # `message` contenait la ligne JSON brute (Filebeat) ; le texte de la ligne est dans `msg`.
  mutate { remove_field => ["message"] }
  if [msg] {
    mutate { rename => { "msg" => "message" } }
  }
}

output {
  if [@metadata][target] == "events" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "herossos-events-%{+YYYY.MM.dd}"
      # L'identifiant de l'événement sert d'identifiant de document : une ligne envoyée deux fois (la
      # journalisation est « au moins une fois ») remplace la première au lieu de s'ajouter.
      document_id => "%{event_id}"
      manage_template => false
      ilm_enabled => false
      data_stream => "false"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "herossos-logs-%{+YYYY.MM.dd}"
      manage_template => false
      ilm_enabled => false
      data_stream => "false"
    }
  }
}
