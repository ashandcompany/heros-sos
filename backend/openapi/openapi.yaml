  /me:
    get:
      tags: [Compte]
      summary: Mon profil
      description: |
        Retourne le profil complet de l'utilisateur connecté, quel que soit son rôle : identité,
        coordonnées, photo, abonnement à la newsletter et, pour un super-héros, son pseudo public et sa
        description (`hero`). Un super-héros n'a pas de profil à part : c'est le même compte, avec
        `role: hero`.

        `pendingEmail` n'est présent que pendant l'examen d'une demande de changement d'adresse. Un
        compte créé hors inscription (un modérateur) peut avoir un téléphone et une adresse vides.
      operationId: getMyAccount
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Le profil de l'utilisateur connecté.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              examples:
                citoyen:
                  summary: Un citoyen avec une demande de changement d'adresse en attente
                  value:
                    id: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
                    role: citizen
                    civility: madame
                    firstName: Natasha
                    lastName: Romanoff
                    birthDate: "1984-11-22"
                    email: natasha.romanoff@example.org
                    pendingEmail: natasha.r@example.org
                    mobilePhone: "0612345678"
                    address:
                      street: 10 rue de Rivoli
                      complement: Bâtiment B, 3e étage
                      postalCode: "75004"
                      city: Paris
                      country: FR
                    avatarUrl: /api/v1/avatars/3f2a8c1e-5b7d-4e90-8a16-2c4d9e7f0b53.jpg
                    newsletterSubscribed: true
                    createdAt: "2026-10-19T12:00:00Z"
                super-heros:
                  summary: Un super-héros
                  value:
                    id: 7d0e4a52-9c3b-4f18-b6a1-5e2f8c9d1a37
                    role: hero
                    civility: monsieur
                    firstName: Steve
                    lastName: Rogers
                    birthDate: "1990-07-04"
                    email: steve.rogers@example.org
                    mobilePhone: "+33612345678"
                    address:
                      street: 569 Leaman Place
                      postalCode: "11201"
                      city: Brooklyn
                      country: US
                    newsletterSubscribed: false
                    createdAt: "2026-10-19T12:00:00Z"
                    hero:
                      alias: Captain America
                      bio: Un super-soldat au bouclier indestructible.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Compte]
      summary: Modifier mes coordonnées
      description: |
        Remplace le téléphone et/ou l'adresse postale, selon les règles de l'inscription. Un champ
        absent n'est pas modifié. `address` est remplacée en bloc, sauf `complement` : absent ou
        `null`, le complément actuel est conservé ; chaîne vide, il est effacé. Le formulaire du profil
        d'un super-héros, qui n'a pas de complément, ne l'efface donc pas.

        Retourne le profil à jour. Le nom, la date de naissance et l'adresse email ne se modifient pas
        ici (l'adresse email passe par `POST /me/email-change-requests`).
      operationId: updateMyContact
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactUpdateRequest" }
            examples:
              adresse-et-telephone:
                summary: Nouveau téléphone et nouvelle adresse
                value:
                  mobilePhone: 06 98 76 54 32
                  address:
                    street: 12 rue des Archives
                    complement: Interphone Dupont
                    postalCode: "75003"
                    city: Paris
                    country: FR
              telephone-seul:
                summary: Le téléphone seulement
                value:
                  mobilePhone: "+33698765432"
      responses:
        "200":
          description: Coordonnées modifiées ; le profil à jour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/avatar:
    put:
      tags: [Compte]
      summary: Changer ma photo de profil
      description: |
        Le corps de la requête est **l'image elle-même** (ni JSON, ni multipart), avec son type dans
        `Content-Type` : `image/jpeg`, `image/png` ou `image/webp`. Limites : 2 Mio (`413`) et
        1024 × 1024 pixels (`422`, champ `avatar` : `too_large`).

        L'image est décodée puis ré-encodée en JPEG : un fichier qui n'est pas une vraie image est
        refusé (`422`, `avatar` : `invalid`), et les métadonnées (EXIF, position GPS) sont effacées.
        L'adresse de la photo (`avatarUrl`) change à chaque envoi : un navigateur peut la garder
        indéfiniment en cache. La photo d'un super-héros est publique (encyclopédie).
      operationId: updateMyAvatar
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Photo remplacée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarResponse" }
              examples:
                nouvelle-photo:
                  summary: L'adresse de la nouvelle photo
                  value:
                    avatarUrl: /api/v1/avatars/3f2a8c1e-5b7d-4e90-8a16-2c4d9e7f0b53.jpg
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415":
          description: Le `Content-Type` n'est ni `image/jpeg`, ni `image/png`, ni `image/webp` (`unsupported_media_type`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                pas-une-image:
                  summary: Type de contenu refusé
                  value:
                    error:
                      code: unsupported_media_type
                      message: Le corps de la requête doit être une image JPEG, PNG ou WebP.
        "422":
          description: |
            Image refusée (`validation_failed`) : `avatar` vaut `required` (corps vide), `invalid` (ce
            n'est pas une image JPEG, PNG ou WebP lisible) ou `too_large` (plus de 1024 pixels de côté).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                image-trop-grande:
                  summary: Image de plus de 1024 pixels
                  value:
                    error:
                      code: validation_failed
                      message: Certaines informations sont invalides.
                      fields:
                        avatar: too_large
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /avatars/{name}:
    get:
      tags: [Compte]
      summary: Photo de profil
      description: |
        Sert une photo de profil. La route est publique : les photos des super-héros sont visibles de
        tous. L'adresse d'une photo (`avatarUrl`) contient un identifiant aléatoire et change à chaque
        envoi ; le contenu d'une adresse ne change jamais, d'où le cache d'un an (`immutable`).
      operationId: getAvatar
      parameters:
        - name: name
          in: path
          required: true
          description: Nom du fichier, tel que donné par `avatarUrl`.
          schema: { type: string }
          example: 3f2a8c1e-5b7d-4e90-8a16-2c4d9e7f0b53.jpg
      responses:
        "200":
          description: La photo, en JPEG.
          headers:
            Cache-Control:
              description: Mise en cache d'un an, sans revalidation.
              schema:
                { type: string, example: "public, max-age=31536000, immutable" }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/email-change-requests:
    post:
      tags: [Compte]
      summary: Demander un changement d'adresse email
      description: |
        Dépose une demande qui aboutit en deux temps : **le titulaire de la nouvelle adresse la
        confirme** par le lien qui lui est envoyé (`POST /email-change-requests/confirm`), puis **un
        modérateur l'accepte**. L'adresse de connexion ne change qu'à ce moment-là ; d'ici là `GET /me`
        la montre dans `pendingEmail` (`pendingEmailConfirmed` dit si le lien a été utilisé). Une nouvelle
        demande remplace la précédente tant qu'elle n'est pas traitée, ce qui invalide l'ancien lien et
        renvoie un mail.

        Réservé aux citoyens et aux super-héros : le compte d'un modérateur se gère hors ligne.
        L'adresse est vérifiée une seconde fois à la validation : si quelqu'un l'a prise entre-temps, le
        modérateur reçoit `email_already_used` et doit refuser la demande.
      operationId: requestMyEmailChange
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeRequestPayload" }
            examples:
              nouvelle-adresse:
                summary: La nouvelle adresse souhaitée
                value:
                  email: natasha.r@example.org
      responses:
        "201":
          description: Demande déposée, en attente de validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChangeRequestStatus" }
              examples:
                en-attente:
                  summary: Demande déposée
                  value:
                    newEmail: natasha.r@example.org
                    status: pending
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: L'adresse est déjà prise par un autre compte (`email_already_used`) ou c'est déjà celle de ce compte (`email_unchanged`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                adresse-prise:
                  summary: Adresse déjà utilisée
                  value:
                    error:
                      code: email_already_used
                      message: Cette adresse email est déjà utilisée.
                adresse-inchangee:
                  summary: C'est déjà l'adresse du compte
                  value:
                    error:
                      code: email_unchanged
                      message: C'est déjà l'adresse email de ce compte.
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /email-change-requests/confirm:
    post:
      tags: [Compte]
      summary: Confirmer une nouvelle adresse email
      description: |
        Route publique : le lien reçu à la nouvelle adresse s'ouvre souvent sur un autre appareil que
        celui de la demande, et il se prouve par sa signature. Elle confirme que le titulaire de
        l'adresse y a accès ; elle **ne change pas** l'adresse du compte, qui reste décidée par un
        modérateur. Cliquer deux fois sur le lien réussit les deux fois. Un lien falsifié, expiré, ou
        devenu sans objet (demande remplacée par son titulaire, ou refusée) répond `invalid_token`.
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
            examples:
              lien-recu:
                summary: Le jeton du lien reçu par mail (à remplacer)
                value:
                  token: collez-ici-le-jeton-du-lien-recu-par-mail
      responses:
        "204": { description: Nouvelle adresse confirmée. }
        "400": { $ref: "#/components/responses/BadRequestOrInvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/newsletter:
    put:
      tags: [Compte]
      summary: Recevoir ou non la newsletter
      description: |
        Abonne ou désabonne le titulaire du compte. Il n'y a pas de mail de confirmation : l'adresse du
        compte a déjà été vérifiée à l'activation (contrairement à `POST /newsletter/subscriptions`).
        L'opération est idempotente. `newsletterSubscribed` de `GET /me` donne l'état courant.
      operationId: setMyNewsletterPreference
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterPreferencePayload" }
            examples:
              abonner:
                summary: S'abonner
                value:
                  subscribed: true
      responses:
        "204": { description: Préférence enregistrée. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/email-change-requests:
    get:
      tags: [Modération]
      summary: Demandes de changement d'adresse email
      description: |
        Réservé aux modérateurs. Les demandes les plus anciennes viennent d'abord. Chaque demande porte
        l'identité du demandeur et son adresse actuelle, pour décider sans autre appel.
      operationId: listEmailChangeRequests
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          description: Ne garde que les demandes dans cet état. Sans valeur, toutes les demandes sont listées.
          schema: { type: string, enum: [pending, approved, rejected] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Une page de demandes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChangeRequestPage" }
              examples:
                une-demande:
                  summary: Une demande en attente
                  value:
                    items:
                      - id: 5c1d7e92-3a40-4b86-9f0e-6d8a2b4c1e75
                        userId: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
                        firstName: Natasha
                        lastName: Romanoff
                        currentEmail: natasha.romanoff@example.org
                        newEmail: natasha.r@example.org
                        status: pending
                        createdAt: "2026-10-21T09:15:00Z"
                        confirmedAt: "2026-10-21T09:40:00Z"
                    total: 1
                    limit: 20
                    offset: 0
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/email-change-requests/{id}/approve:
    post:
      tags: [Modération]
      summary: Accepter un changement d'adresse
      description: |
        Réservé aux modérateurs. L'adresse de connexion du compte devient la nouvelle adresse, et son
        abonnement à la newsletter la suit. **Seule une demande dont l'adresse est confirmée** (`confirmedAt`)
        peut être acceptée : sinon `email_change_not_confirmed`, et il ne reste qu'à la refuser ou à
        attendre. La nouvelle adresse et l'ancienne en sont ensuite prévenues par mail. Si l'adresse a été
        prise entre-temps, rien n'est modifié : `email_already_used`, et la demande reste à refuser. Une demande remplacée par son titulaire
        change d'identifiant : l'ancien identifiant répond `email_change_not_found`, pour qu'un
        modérateur ne valide jamais une adresse qu'il n'a pas vue.
      operationId: approveEmailChangeRequest
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/EmailChangeRequestId" }
      responses:
        "204": { description: "Demande acceptée, adresse changée." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EmailChangeNotFound" }
        "409":
          description: La demande a déjà été traitée (`email_change_not_pending`), son adresse n'est pas confirmée (`email_change_not_confirmed`), ou l'adresse est maintenant prise (`email_already_used`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                deja-traitee:
                  summary: Demande déjà traitée
                  value:
                    error:
                      code: email_change_not_pending
                      message: Cette demande a déjà été traitée.
                pas-confirmee:
                  summary: Adresse pas encore confirmée par son titulaire
                  value:
                    error:
                      code: email_change_not_confirmed
                      message: Le titulaire de la nouvelle adresse ne l'a pas encore confirmée.
                adresse-prise:
                  summary: L'adresse a été prise entre-temps
                  value:
                    error:
                      code: email_already_used
                      message: Cette adresse email est déjà utilisée.
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/email-change-requests/{id}/reject:
    post:
      tags: [Modération]
      summary: Refuser un changement d'adresse
      description: Réservé aux modérateurs. L'adresse du compte ne change pas, son titulaire en est prévenu par mail et peut déposer une nouvelle demande. Une demande dont l'adresse n'est pas confirmée peut être refusée.
      operationId: rejectEmailChangeRequest
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/EmailChangeRequestId" }
      responses:
        "204": { description: Demande refusée. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EmailChangeNotFound" }
        "409":
          description: La demande a déjà été traitée (`email_change_not_pending`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                deja-traitee:
                  summary: Demande déjà traitée
                  value:
                    error:
                      code: email_change_not_pending
                      message: Cette demande a déjà été traitée.
        "500": { $ref: "#/components/responses/InternalError" }

  /contact/messages:
    post:
      tags: [Contact et newsletter]
      summary: Écrire à l'équipe
      description: |
        Formulaire de contact, ouvert à tous. Le message est transmis par mail à l'équipe (adresse
        `HEROS_CONTACT_RECIPIENT`), avec l'adresse du visiteur en réponse : le visiteur ne reçoit
        jamais de mail de cette route. Rien n'est conservé en base.

        Limité par adresse IP. `503` (`contact_delivery_unavailable`) si le message n'a pas pu être
        confié au service d'envoi : il n'est alors pas parti, et le visiteur peut réessayer.
      operationId: sendContactMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactMessageRequest" }
            examples:
              question:
                summary: Une question sur le service
                value:
                  name: Natasha Romanoff
                  email: natasha.romanoff@example.org
                  subject: question
                  message: Bonjour, comment puis-je devenir super-héros sur la plateforme ?
      responses:
        "202": { description: Message accepté pour envoi. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Le message n'a pas pu être envoyé (`contact_delivery_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                envoi-impossible:
                  summary: File d'envoi saturée ou fermée
                  value:
                    error:
                      code: contact_delivery_unavailable
                      message: Le message n'a pas pu être envoyé. Veuillez réessayer plus tard.
        "500": { $ref: "#/components/responses/InternalError" }

  /newsletter/subscriptions:
    post:
      tags: [Contact et newsletter]
      summary: S'abonner à la newsletter
      description: |
        Abonnement d'un visiteur, en deux temps (double opt-in) : cette route enregistre la demande et
        envoie un lien de confirmation à l'adresse ; aucune newsletter n'est envoyée avant le clic
        (`POST /newsletter/subscriptions/confirm`). Le lien est signé et valable 48 h par défaut.

        La réponse est la même pour toute adresse valide, inconnue, en attente ou déjà abonnée : elle ne
        révèle rien (une adresse déjà abonnée ne reçoit pas de mail de plus). Une adresse qui s'était
        désabonnée doit confirmer de nouveau. Limité par IP et par adresse, pour que le formulaire ne
        serve pas à inonder la boîte de quelqu'un d'autre.
      operationId: subscribeToNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/NewsletterSubscriptionRequest" }
            examples:
              visiteur:
                summary: Un visiteur
                value:
                  email: natasha.romanoff@example.org
      responses:
        "202":
          {
            description: Demande prise en compte ; un lien de confirmation est envoyé si l'adresse n'était pas déjà abonnée.,
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /newsletter/subscriptions/confirm:
    post:
      tags: [Contact et newsletter]
      summary: Confirmer l'abonnement à la newsletter
      description: |
        Valide l'abonnement avec le jeton du lien reçu par mail ; la date de confirmation est la preuve de
        consentement. Cliquer deux fois sur le lien réussit les deux fois. Un lien falsifié, expiré, ou
        devenu sans objet (l'abonné s'est retiré entre-temps) répond `invalid_token`.
      operationId: confirmNewsletterSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
            examples:
              lien-recu:
                summary: Le jeton du lien reçu par mail (à remplacer)
                value:
                  token: collez-ici-le-jeton-du-lien-recu-par-mail
      responses:
        "204": { description: Abonnement confirmé. }
        "400": { $ref: "#/components/responses/BadRequestOrInvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

  /newsletter/subscriptions/unsubscribe:
    post:
      tags: [Contact et newsletter]
      summary: Se désabonner de la newsletter
      description: |
        Route publique : chaque newsletter porte un lien de désinscription, qui s'ouvre sans connexion.
        Il désigne l'abonnement (jamais l'adresse) et n'expire pas : le lien d'une ancienne newsletter
        reste utilisable. Cliquer deux fois sur le lien réussit les deux fois. Un lien falsifié, ou fabriqué
        pour une autre action (confirmation), répond `invalid_token`.

        La désinscription garde la ligne de l'abonné : se réabonner depuis le pied de page redemande un
        consentement (`POST /newsletter/subscriptions`, puis confirmation par lien).
      operationId: unsubscribeFromNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
            examples:
              lien-recu:
                summary: Le jeton du lien de désinscription d'une newsletter (à remplacer)
                value:
                  token: collez-ici-le-jeton-du-lien-recu-par-mail
      responses:
        "204": { description: Abonné retiré de la newsletter. }
        "400": { $ref: "#/components/responses/BadRequestOrInvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        Cookie de session, posé par `POST /auth/login` (`__Host-session` en production). Un
        navigateur l'envoie tout seul : **ne rien saisir ici**. Il existe pour indiquer quelles
        routes demandent d'être connecté.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Jeton CSRF : la valeur de `csrfToken` renvoyée par `POST /auth/login` et `GET /auth/me`.
        Exigé sur les écritures authentifiées. À coller ici après la connexion.

  parameters:
    HeroId:
      name: heroId
      in: path
      required: true
      description: Identifiant du super-héros.
      schema: { type: string, format: uuid }
    VillainId:
      name: villainId
      in: path
      required: true
      description: Identifiant du super-vilain.
      schema: { type: string, format: uuid }
    ArticleId:
      name: id
      in: path
      required: true
      description: Identifiant de l'article.
      schema: { type: string, format: uuid }
    ArticleSlug:
      name: slug
      in: path
      required: true
      description: Identifiant d'URL de l'article.
      schema: { type: string }
    FilmId:
      name: filmId
      in: path
      required: true
      description: Identifiant du film.
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      description: Identifiant de l'utilisateur dont la demande est traitée (champ `userId` de la liste des demandes).
      schema: { type: string, format: uuid }
      example: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
    Id:
      name: id
      in: path
      required: true
      description: Identifiant de l'utilisateur (champ `id` de la liste des comptes).
      schema: { type: string, format: uuid }
      example: 0b8c1c3e-6f1d-4c7e-9a52-3d2f7b9e4a10
    EmailChangeRequestId:
      name: id
      in: path
      required: true
      description: Identifiant de la demande de changement d'adresse (champ `id` de la liste des demandes).
      schema: { type: string, format: uuid }
      example: 5c1d7e92-3a40-4b86-9f0e-6d8a2b4c1e75
    Limit:
      name: limit
      in: query
      description: Nombre d'éléments par page (1 à 100, 20 par défaut).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Nombre d'éléments à sauter.
      schema: { type: integer, minimum: 0, default: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID choisi par le client pour cette action. Si la même clé revient (rejeu après une coupure de connexion,
        action faite hors ligne puis synchronisée), la réponse du premier passage est rendue telle quelle, avec
        l'en-tête `Idempotent-Replayed: true`, sans rien refaire. Seules les réussites sont conservées : après une
        erreur, la même clé se rejoue. La même clé avec une autre requête est refusée (422, `idempotency_key_reused`).
        La clé est propre à son auteur.
      schema: { type: string, format: uuid }
    ClientCreatedAt:
      name: X-Client-Created-At
      in: header
      required: false
      description: |
        Date (RFC 3339) à laquelle l'action a été créée sur l'appareil, pour une action faite hors ligne. Elle sert à
        mesurer le délai de synchronisation, et reste sans effet sans `Idempotency-Key`. Une date plus avancée que
        l'heure du serveur est ramenée à l'heure de réception.
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: "Requête mal formée (`bad_request`) : JSON invalide, champ inconnu, corps vide."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            json-invalide:
              summary: Corps qui n'est pas du JSON valide
              value:
                error:
                  code: bad_request
                  message: Le corps de la requête n'est pas un JSON valide.
    BadRequestOrInvalidToken:
      description: Requête mal formée (`bad_request`) ou lien invalide, expiré ou déjà utilisé (`invalid_token`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            lien-invalide:
              summary: Lien invalide, expiré ou déjà utilisé
              value:
                error:
                  code: invalid_token
                  message: Ce lien est invalide, expiré ou déjà utilisé.
            json-invalide:
              summary: Corps qui n'est pas du JSON valide
              value:
                error:
                  code: bad_request
                  message: Le corps de la requête n'est pas un JSON valide.
    Unauthenticated:
      description: Session absente ou expirée (`unauthenticated`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            session-absente:
              summary: Session absente ou expirée
              value:
                error:
                  code: unauthenticated
                  message: Authentification requise.
    Forbidden:
      description: |
        Refusé : origine non autorisée (`origin_not_allowed`), jeton CSRF absent ou invalide
        (`csrf_invalid`), rôle insuffisant (`forbidden`, `protected_account`), ou **session limitée**
        (`mfa_required` : la double authentification doit d'abord être validée ou activée, voir `GET /auth/mfa`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            origine:
              summary: Origine non autorisée
              value:
                error:
                  code: origin_not_allowed
                  message: Origine non autorisée.
            csrf:
              summary: Jeton CSRF absent ou invalide
              value:
                error:
                  code: csrf_invalid
                  message: Jeton CSRF absent ou invalide.
            role:
              summary: Rôle insuffisant
              value:
                error:
                  code: forbidden
                  message: Vous n'avez pas les droits nécessaires.
            session-limitee:
              summary: Session limitée (double authentification pas encore validée)
              value:
                error:
                  code: mfa_required
                  message: La double authentification doit d'abord être validée.
            compte-protege:
              summary: Compte de modérateur
              value:
                error:
                  code: protected_account
                  message: Les comptes de modérateur ne peuvent pas être désactivés par l'API.
    NotFound:
      description: Ressource introuvable (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            utilisateur:
              summary: Utilisateur introuvable
              value:
                error:
                  code: not_found
                  message: Utilisateur introuvable.
    EmailChangeNotFound:
      description: Aucune demande de changement d'adresse ne porte cet identifiant (`email_change_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            demande-introuvable:
              summary: Demande introuvable, ou remplacée par son titulaire
              value:
                error:
                  code: email_change_not_found
                  message: Demande de changement d'adresse introuvable.
    PayloadTooLarge:
      description: Corps de requête trop volumineux (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            trop-gros:
              summary: Corps trop volumineux
              value:
                error:
                  code: payload_too_large
                  message: Le corps de la requête est trop volumineux.
    UnsupportedMediaType:
      description: Le corps doit être de type `application/json` (`unsupported_media_type`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            pas-json:
              summary: Corps qui n'est pas en application/json
              value:
                error:
                  code: unsupported_media_type
                  message: Le corps de la requête doit être au format application/json.
    ValidationFailed:
      description: Données invalides (`validation_failed`) ; `fields` détaille chaque champ.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            champs-invalides:
              summary: Deux champs invalides
              value:
                error:
                  code: validation_failed
                  message: Certaines informations sont invalides.
                  fields:
                    email: invalid
                    password: weak
    RateLimited:
      description: Trop de requêtes (`rate_limited`) ou compte verrouillé (`account_locked`).
      headers:
        Retry-After:
          description: Délai en secondes avant de réessayer.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            trop-de-requetes:
              summary: Trop de requêtes
              value:
                error:
                  code: rate_limited
                  message: Trop de tentatives, réessayez plus tard.
            compte-verrouille:
              summary: Compte verrouillé
              value:
                error:
                  code: account_locked
                  message: Compte temporairement verrouillé après trop d'échecs de connexion.
    InternalError:
      description: Erreur interne (`internal_error`). Le détail n'est jamais exposé.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            erreur-interne:
              summary: Erreur interne
              value:
                error:
                  code: internal_error
                  message: Une erreur interne est survenue.

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Code stable destiné au frontend.
              example: invalid_credentials
            message:
              type: string
              description: Message destiné à l'affichage.
            fields:
              type: object
              description: Pour les erreurs de validation, champ → code (`required`, `invalid`, `too_short`, `too_long`, `weak`, et `too_large` pour une photo).
              additionalProperties: { type: string }

    UserView:
      type: object
      required: [id, displayName, role, email]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Identifiant de l'utilisateur.,
          }
        displayName:
