name: Backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest

    # Base PostgreSQL pour les tests d'intégration (dépôts, services, API de bout en bout).
    # Sans elle, ces tests échouent en CI plutôt que d'être ignorés silencieusement.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: heros
          POSTGRES_PASSWORD: heros
          POSTGRES_DB: herossos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heros -d herossos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HEROS_TEST_DATABASE_URL: postgres://heros:heros@localhost:5432/herossos_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Échoue uniquement si une vulnérabilité atteignable dans le code est détectée
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test (*_test.go)
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...
