name: Frontend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Seules les vulnérabilités high/critical font échouer (low/moderate tolérées).
      # Avis ignorés (à retirer dès qu'un correctif existe) :
      # - GHSA-vfj7-8cjw-p6xm : braces@3.0.3 (dernière version, aucun correctif), dépendance de dev
      #   d'eslint-config-next ; absent des dépendances de production (`npm audit --omit=dev`).
      - name: Dependency audit
        run: npx --yes audit-ci@7.1.0 --high --allowlist GHSA-vfj7-8cjw-p6xm

      - name: Check formatting
        run: npx prettier --check .

      - name: Build
        run: npm run build
